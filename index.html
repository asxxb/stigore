<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ink Walker</title>
    <style>
        :root {
            --paper: #e4e2de;
            --ink: #111;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--paper);
            overflow: hidden;
            touch-action: none
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%
        }

        #hud {
            position: fixed;
            left: 14px;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            font: 15px/1.4 Georgia, serif;
            color: #222;
            opacity: .7;
            pointer-events: none
        }

        .btns {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 18px
        }

        .btns div {
            display: flex;
            gap: 12px
        }

        .b {
            width: 68px;
            height: 68px;
            border: 3px solid #111;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            font: 28px Georgia, serif;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none
        }

        @media (pointer:coarse) {
            .btns {
                display: flex
            }
        }

        @media (max-width:420px) {
            .b {
                width: 56px;
                height: 56px;
                font-size: 24px
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="hud">A / D or ← → to walk · Shift to run · Space to jump · Shift+Space (running): parkour tumble · K: knife
        · J: stab · L: throw
    </div>
    <div class="btns">
        <div><span class="b" id="bl">◀</span><span class="b" id="br">▶</span></div>
        <div><span class="b" id="bp">J</span><span class="b" id="bk">K</span><span class="b" id="bj">▲</span></div>
        <span class="b" id="bd"
            style="position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 98px)">▼</span>
        <span class="b" id="bh"
            style="position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 178px)">H</span>
    </div>
    <script>
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        let W, H, DPR, paper, vig;
        function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s) }
        function makePaper() {
            const p = document.createElement('canvas'); p.width = p.height = 512; const g = p.getContext('2d');
            g.fillStyle = '#e6e4e0'; g.fillRect(0, 0, 512, 512);
            const id = g.getImageData(0, 0, 512, 512), d = id.data;
            for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 26; d[i] += n; d[i + 1] += n; d[i + 2] += n }
            g.putImageData(id, 0, 0);
            g.globalAlpha = .05; g.strokeStyle = '#777';
            for (let i = 0; i < 260; i++) { g.beginPath(); const x = Math.random() * 512, y = Math.random() * 512; g.moveTo(x, y); g.lineTo(x + Math.random() * 10 - 5, y + Math.random() * 10 - 5); g.stroke() }
            paper = ctx.createPattern(p, 'repeat');
        }
        function resize() {
            DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
            cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .8);
            vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(60,50,40,.28)');
        }
        makePaper(); resize(); addEventListener('resize', resize);

        const keys = {};
        addEventListener('keydown', e => {
            keys[e.code] = 1;
            if (e.code === 'Space') e.preventDefault();
            if (e.repeat) return;
            if (e.code === 'KeyC') pressSmoke();
            if (P.sm === 1) return;                 // no actions while lighting up
            if (P.sgp > 0) return;    // no actions mid-stomp
            if (e.code === 'KeyG') pressG();
            if (e.code === 'KeyH') pressHorse();
            if (e.code === 'KeyF') pressFire();
            if (e.code === 'KeyZ') pressSgDraw();
            if (e.code === 'KeyB') pressSgFire(true);
            if (e.code === 'KeyR') pressReload();
            if (e.code === 'KeyK') pressK();
            if (e.code === 'KeyL') pressThrow();
            if (e.code === 'KeyE') pressFinish();
            if (e.code === 'Space') pressJump();
            if (e.code === 'KeyJ') pressAtk();
        });
        addEventListener('keyup', e => keys[e.code] = 0);
        function hold(id, k) {
            const el = document.getElementById(id);
            ['pointerdown'].forEach(t => el.addEventListener(t, e => { e.preventDefault(); keys[k] = 1 }));
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, () => keys[k] = 0));
        }
        hold('bl', 'ArrowLeft'); hold('br', 'ArrowRight'); hold('bj', 'Space'); document.getElementById('bk').addEventListener('pointerdown', e => { e.preventDefault(); pressK() });
        document.getElementById('bj').addEventListener('pointerdown', pressJump);
        hold('bd', 'ArrowDown');
        document.getElementById('bp').addEventListener('pointerdown', e => { e.preventDefault(); pressAtk() });
        document.getElementById('bh').addEventListener('pointerdown', e => { e.preventDefault(); pressHorse() });


        const P = {
            gk: 0, x: 0, vx: 0, z: 0, vz: 0, face: 1, phase: 0, dist: 0, atk: 0, kn: 0, kt: 0, amp: 0, lean: 0, tt: 0, rv: 0,
            jbuf: 0, coy: 0, cs: 0, ct: 0, chit: false, abuf: 0, clast: 0, cgr: 0, gt: 0, grabbed: null,
            skid: 0, skidDir: 1, skidK: 0, skA: 0, sk: null,
            idle: 0, idleAt: 3.5, fid: 0, fidType: 0, fidT: 0, fidDur: 2.4, fidK: 0,
            pk: 0, pkT: 0, pkDir: 1, pkHit: [0, 0, 0]
        };
        // knife states: kn 0 = away, 1 = forward grip, 2 = reverse grip (blade to the back)
        let CUR = P; const PL = P;   // CUR = character being drawn/animated (player or NPC)
        P.thw = 0; P.thr = 0;           // throw timer / released flag
        P.stbk = 0; P.stbHit = false;  // knife stab timer / hit flag
        P.fin = 0; P.finE = null; P.finDone = 0;
        const THR_T = .32;              // throw animation length
        const knives = [];
        const THROW_RANGE = 650;   // max distance (px) a thrown knife can fly before it drops
        const PICKUP_R = 70;       // how close you need to be to grab a knife (scaled)
        let hasKnife = true;       // you only own one knife now
        const groundKnives = [];
        const TOSS_T = .95;
        function pressK() {
            if (P.mount) { banner.t = .6; banner.text = 'DISMOUNT FIRST (H)'; return }
            if (P.thw > 0 || P.fin > 0 || P.pk > 0) return;
            if (P.gun || P.gs === 2 || P.sg) { banner.t = .6; banner.text = 'HOLSTER GUN FIRST (G)'; return }
            P.idle = 0; P.fid = 0;
            if (P.tt > 0) return;
            if (P.kn === 0) {
                if (!hasKnife) { banner.t = .6; banner.text = 'NO KNIFE!'; return }
                P.kn = 1; P.rv = 0
            }
            else if (P.kn === 1) { if (P.kt > .95) P.tt = .0001 }
            else P.kn = 0;
        }

        let last = performance.now();
        function groundY() { return H * 0.76 }

        // ---- movement feel tuning ----
        const GRAV = 1700;
        const JUMP_V = 540;
        const CUT_MULT = 6;
        const COYOTE = .1;
        const BUFFER = .1;
        const SKID_MIN = 280;
        const SKID_END = 60;
        const SKID_ACC = 1300;
        const IDLE_MIN = 3, IDLE_MAX = 6;
        function pressJump() { P.jbuf = BUFFER }

        // ---- ink skid marks + flecks + ghost afterimages (world space) ----
        const streaks = [], flecks = [], ghosts = [], impacts = [];
        function startSkid(d) {
            P.skid = 1; P.skidDir = d; P.face = d; P.skA = 0;
            const S = CSc(), mk = (off, dy, w) => { const x = P.x + d * off * S, st = { x0: x, x1: x, off, dy, w, live: true, t: 0, seed: Math.random() * 100 }; streaks.push(st); return st };
            P.sk = [mk(62, 5.5, 8), mk(14, 9.5, 5.5)];
        }
        function endSkid() { P.skid = 0; if (P.sk) for (const s of P.sk) s.live = false; P.sk = null }
        function skidFX(dt) {
            const S = CSc();
            if (P.skid) {
                for (const s of P.sk) s.x1 = P.x + P.skidDir * s.off * S;
                P.skA += dt;
                while (P.skA > .03) {
                    P.skA -= .03;
                    flecks.push({ x: P.x + P.skidDir * 62 * S, y: -2, vx: P.skidDir * (40 + Math.random() * 120), vy: -(60 + Math.random() * 180), r: 1 + Math.random() * 2, t: 0, life: .35 + Math.random() * .3 })
                }
            }
            for (let i = flecks.length - 1; i >= 0; i--) { const f = flecks[i]; f.t += dt; f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.t > f.life || f.y > 0) flecks.splice(i, 1) }
            for (let i = impacts.length - 1; i >= 0; i--) { impacts[i].t += dt; if (impacts[i].t >= impacts[i].life) impacts.splice(i, 1) }
            for (let i = streaks.length - 1; i >= 0; i--) { const s = streaks[i]; if (!s.live) { s.t += dt; if (s.t > 3.4) streaks.splice(i, 1) } }
            for (let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.t += dt; if (g.t >= g.life) ghosts.splice(i, 1) }
        }
        function addGhost(P, pose) {
            if (ghosts.length > 14) ghosts.shift();
            ghosts.push({
                x: P.x, z: P.z, face: P.face, rot: P.rot || 0, py: (pose && pose.py !== undefined) ? pose.py : undefined,
                pose: {
                    a0: pose.a0, f0: pose.f0, a1: pose.a1, f1: pose.f1,
                    lean: pose.lean, hipX: pose.hipX, hipY: pose.hipY,
                    arch: pose.arch, hx: pose.hx, hy: pose.hy,
                    l0: [...pose.l0], l1: [...pose.l1]
                },
                t: 0, life: 0.22, alpha: 0.44
            });
        }
        function drawGhosts(gy) {
            const S = CSc();
            for (const g of ghosts) {
                const sx = g.x - P.x + W / 2;
                if (Math.abs(sx - W / 2) > W / 2 + 150) continue;
                const a = Math.max(0, (1 - g.t / g.life) * g.alpha);
                if (a <= 0.01) continue;
                const F = g.face, pose = g.pose;
                ctx.save(); ctx.translate(sx, gy + 4); ctx.scale(S, S); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                const z = g.z / S, hipY = -(ANK + 120) + z + (pose.hipY || 0);
                if (g.rot) {
                    const pk = Math.min(1, -z / 60);
                    const py = (g.py !== undefined) ? g.py : (-40 * (1 - pk) + ((pose.hipY || 0) - 30) * pk);
                    ctx.translate(0, py); ctx.rotate(g.rot); ctx.translate(0, -py);
                }
                ctx.globalAlpha = a * 0.75; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
                const hipX = F * (pose.hipX || 0), l = F * pose.lean;
                const rot = (x, y) => [hipX + x * Math.cos(l) - y * Math.sin(l), hipY + x * Math.sin(l) + y * Math.cos(l)];
                const nk = rot(0, -T), cp = rot(-F * (9 + (pose.arch || 0) * 28), -T / 2);
                for (let i = 1; i >= 0; i--) {
                    const targetL = i === 0 ? pose.l0 : pose.l1, fx = hipX + F * targetL[0], fy = (P && P.pk > 0) ? targetL[1] : (targetL[1] - (targetL[2] || 0));
                    const ax = fx, ay = fy - ANK, dx = ax - hipX, dy = ay - hipY, dd = Math.hypot(dx, dy);
                    const d = Math.min(dd, 2 * L1 - 0.5), ux0 = dx / (dd || 1), uy0 = dy / (dd || 1), mx = hipX + ux0 * d / 2, my = hipY + uy0 * d / 2;
                    const h = Math.sqrt(Math.max(0, L1 * L1 - d * d / 4));
                    let nx = -uy0, ny = ux0;
                    if (dx * F < -15) { if (nx * F > 0) { nx = -nx; ny = -ny } }
                    else { if (nx * F < 0) { nx = -nx; ny = -ny } }
                    const kx = mx + nx * h, ky = my + ny * h;
                    ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.lineTo(ax, ay); ctx.stroke();
                    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 7); ctx.fill();
                }
                ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.quadraticCurveTo(cp[0], cp[1], nk[0], nk[1]); ctx.stroke();
                if (P === PL) { const hp = rot(F * 8, -14); drawHolster([hp[0], hp[1], l], F, (!P.gun && P.gs !== 2) || (P.gs === 2 && P.gsT >= 0.75)) }
                const sh = rot(0, -T + 10);
                for (let i = 0; i < 2; i++) {
                    const ang = i ? pose.a1 : pose.a0, flex = i ? pose.f1 : pose.f0, d1 = [Math.sin(ang) * F, Math.cos(ang)], el = [sh[0] + d1[0] * 58, sh[1] + d1[1] * 58];
                    const d2 = [Math.sin(ang + flex) * F, Math.cos(ang + flex)], wr = [el[0] + d2[0] * 56, el[1] + d2[1] * 56];
                    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(el[0], el[1]); ctx.lineTo(wr[0], wr[1]); ctx.stroke();
                    ctx.beginPath(); ctx.arc(wr[0], wr[1], 4.5, 0, 7); ctx.fill();
                }
                const hd = rot(-F * 7 + F * (pose.hx || 0), -T - 24 + (pose.hy || 0));
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hd[0], hd[1], 23, 0, 7); ctx.stroke();
                ctx.restore();
            }
        }
        function drawSkid(gy) {
            ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
            for (const s of streaks) {
                const a = s.live ? 1 : 1 - sm(Math.max(0, s.t - 1.2) / 2.2);
                const sx0 = s.x0 - P.x + W / 2, sx1 = s.x1 - P.x + W / 2, len = Math.abs(sx1 - sx0);
                if (len < 3 || a <= 0) continue;
                const dr = Math.sign(sx1 - sx0), y = gy + s.dy;
                for (let d = 0; d < len; d += 10) {
                    const i = d / 10, e = Math.min(len, d + 10);
                    ctx.globalAlpha = a * (.55 + .45 * hash(s.seed + i));
                    ctx.lineWidth = s.w * (.3 + .7 * Math.min(1, d / 60)) * (.8 + .4 * hash(s.seed + i * 3));
                    ctx.beginPath(); ctx.moveTo(sx0 + dr * d, y + (hash(s.seed + i * 7) - .5) * 1.6); ctx.lineTo(sx0 + dr * e, y + (hash(s.seed + i * 7 + 1) - .5) * 1.6); ctx.stroke();
                }
            }
            for (const m of impacts) {
                const k = m.t / m.life, sx = m.x - P.x + W / 2, sy = gy + 4 + m.y; ctx.globalAlpha = 1 - k * k;
                for (let i = 0; i < 12; i++) {
                    const ang = i / 12 * Math.PI * 2 + hash(i + m.seed) * .3, r0 = m.s * .15 * (1 + k), r1 = m.s * (.35 + .5 * hash(i * 2.3 + m.seed)) * (.4 + .9 * Math.min(1, k * 2));
                    ctx.lineWidth = Math.max(1, 6 * (1 - k) * (.5 + hash(i))); ctx.beginPath(); ctx.moveTo(sx + Math.cos(ang) * r0, sy + Math.sin(ang) * r0); ctx.lineTo(sx + Math.cos(ang) * r1, sy + Math.sin(ang) * r1); ctx.stroke()
                }
            }
            for (const f of flecks) { ctx.globalAlpha = Math.max(0, 1 - f.t / f.life); ctx.beginPath(); ctx.arc(f.x - P.x + W / 2, gy + 4 + f.y, f.r, 0, 7); ctx.fill() }
            ctx.restore();
        }

        // ---- idle fidgets ----
        function startFidget(q) {
            q.fid = 1; q.fidT = 0;
            const canStretch = q.kn === 0 && q.kt < .05;
            q.fidType = (canStretch && Math.random() < .5) ? 2 : 1;
            q.fidDur = q.fidType === 2 ? 2.4 : 2.8;
            q.idleAt = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
        }
        function fidgetTick(q, busy, dt) {
            if (busy) { q.idle = 0; q.fid = 0 }
            else if (q.fid) { q.fidT += dt; if (q.fidT >= q.fidDur) { q.fid = 0; q.idle = 0 } }
            else { q.idle += dt; if (q.idle >= q.idleAt) startFidget(q) }
            q.fidK += ((q.fid ? 1 : 0) - q.fidK) * Math.min(1, dt * (q.fid ? 8 : 12));
            if (!q.fid && q.fidK < .01) { q.fidK = 0; q.fidT = 0 }
        }
        function lookCurve(u) {
            const k = [[0, 0], [.18, -1], [.42, -1], [.6, .9], [.8, .9], [1, 0]];
            for (let i = 1; i < k.length; i++)if (u <= k[i][0]) { const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * sm((u - a[0]) / (b[0] - a[0])) }
            return 0;
        }
        function stretchEnv(u) { return u < .25 ? sm(u / .25) : u < .75 ? 1 : 1 - sm((u - .75) / .25) }

        function update(dt) {
            if (P.pk > 0) {
                parkourTick(dt);
                if (P.atk > 0) P.atk -= dt;
                comboTick(dt);
                stabTick(dt);
                fidgetTick(P, true, dt);
                return;
            }
            const dir = (P.fin > 0 || P.sm === 1 || P.fs > 0 || P.yk > 0 || P.gu > 0 || P.sgp > 0 || P.mount) ? 0 : (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
            const run = keys.ShiftLeft || keys.ShiftRight;
            const max = run ? 520 : 190;
            const grounded = P.z >= 0;
            const acc = grounded ? 900 : 300;

            // ---- skid turn: reversing at a run ----
            const vs = Math.sign(P.vx);
            if (P.skid) { if (!grounded || !dir || dir === vs || Math.abs(P.vx) < SKID_END) endSkid() }
            else if (grounded && dir && vs && dir !== vs && Math.abs(P.vx) >= SKID_MIN && !P.cs) startSkid(vs);

            if (dir && !P.cs) {
                if (P.skid) P.vx += dir * SKID_ACC * dt;
                else { P.vx += dir * acc * dt; if (P.skidK < .25) P.face = dir }
            }
            else if (grounded) { const f = 1400 * dt; P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f }
            const lim = max; if (Math.abs(P.vx) > lim) P.vx += (Math.sign(P.vx) * lim - P.vx) * Math.min(1, dt * 8);
            if (!P.mount) P.x += P.vx * dt;

            // ---- parkour tumbling pass: Sprint + Jump at speed ----
            const isSprinting = run && Math.abs(P.vx) > 220;
            if (P.jbuf > 0 && isSprinting && grounded && !P.pk && !P.mount && !P.cs && !P.fin && !P.stbk && !P.sg) {
                startParkour(vs || P.face || 1);
                P.jbuf = 0;
            }

            // ---- jump: buffering + coyote time + variable height ----
            if (grounded) P.coy = COYOTE; else P.coy = Math.max(0, P.coy - dt);
            if (P.jbuf > 0) {
                if ((grounded || P.coy > 0) && !P.cs && !P.fin && !P.pk && !(P.yk > 0) && !(P.gu > 0) && !(P.sgp > 0) && !P.mount) { P.vz = -JUMP_V; P.jbuf = 0; P.coy = 0; P.grabbed = null; P.clast = 0 }// jumping breaks the clinch
                else P.jbuf = Math.max(0, P.jbuf - dt);
            }
            const g = GRAV * (P.vz < 0 && !keys.Space ? CUT_MULT : 1);
            if (P.vz !== 0 || P.z < 0) { P.vz += g * dt; P.z += P.vz * dt; if (P.z >= 0) { P.z = 0; P.vz = 0 } }

            const sp = Math.abs(P.vx);

            if (P.z >= 0) P.phase += sp * dt / (((1 - Rf()) * 280 + Rf() * RUN_LC) * CSc()) * Math.PI * 2;
            if (P.atk > 0) P.atk -= dt;
            P.kt = Math.max(0, Math.min(1, P.kt + (P.kn ? 1 : -1) * dt * 3.5));
            if (P.tt > 0) { P.tt += dt; if (P.tt >= TOSS_T) { P.tt = 0; P.kn = 2; P.rv = 1 } }
            if (P.thw > 0) {
                P.thw += dt;
                if (!P.thr && P.thw >= THR_T * .65) releaseKnife();
                if (P.thw >= THR_T) { P.thw = 0; P.thr = 0 }
            }
            if (P.fin > 0) finTick(dt);
            fsTick(dt);
            sgpTick(dt);
            gutTick(dt);
            ykTick(dt);
            comboTick(dt);
            stabTick(dt);
            const target = Math.min(1, sp / 200) * (run && sp > 220 ? 1.25 : 1);
            P.amp += (target - P.amp) * Math.min(1, dt * 10);
            const tl = Math.max(-1, Math.min(1, P.vx / 420)) * 0.4;
            P.lean += (tl - P.lean) * Math.min(1, dt * 6);

            // ---- skid pose blend + marks ----
            P.skidK += ((P.skid ? 1 : 0) - P.skidK) * Math.min(1, dt * 14);
            if (!P.skid && P.skidK < .005) P.skidK = 0;
            skidFX(dt);

            // ---- clinch blend (0..1): drives step-in, lean and hand IK ----

            if (grounded && Math.abs(P.vx) > 300) {
                P.dust = (P.dust || 0) - dt;
                if (P.dust <= 0) {
                    P.dust = .06; const d = -Math.sign(P.vx);
                    flecks.push({ x: P.x + d * 30 * CSc(), y: -2, vx: d * (60 + Math.random() * 80), vy: -(40 + Math.random() * 90), r: 1 + Math.random() * 1.8, t: 0, life: .3 + Math.random() * .25 });
                }
            }
            // ---- idle fidgets ----

        function sgGroundTick(dt) {

        function sgpEnv() { const t = P.sgpT; return sm((t - .08) / .3) * (1 - sm((t - SGP_HIT - .1) / .4)) }   // crouch / lean weight

        function sgpFoot(S, fx0, fy0, lf0, F) {      // front foot: chamber up, slam onto the gun, release

            if (t < SGP_UP) { const k = sm((t - .05) / (SGP_UP - .05)); return [lerp(fx0, ux, k), lerp(fy0, uy, k), lerp(lf0, 34, k)] }

        function sgpFly(S, dt) {                               // flip up, spin once, land in the hand
            const g = SGG, F = P.face, u = Math.min(1, (P.sgpT - SGP_HIT) / SGP_FLY);

            const ex = P.x + w[0] * S + F * SG_CEN * S, ey = w[1] * S;          // where the gun's centre must be when the hand closes

        function sgPropBody() {                                // gun drawn around its grip (0,0), same look as the held one

            ctx.quadraticCurveTo(-9, 18, -3, 16); ctx.quadraticCurveTo(3, 12, 5, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = WOOD_D; ctx.beginPath(); ctx.moveTo(-33, -3); ctx.lineTo(-27, -8); ctx.lineTo(-14, -9); ctx.lineTo(-9, -4); ctx.lineTo(-15, 3); ctx.lineTo(-28, 4); ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.2; ctx.stroke(); ctx.lineWidth = 2.2;

        function drawSgProp(gy, front) {                       // front=false: on the ground (behind the player), front=true: flipping through the air
            const g = SGG;

            if (g.flying) {                                    // motion-blur afterimages

                g.tr.forEach((q, j) => {
                    ctx.save(); ctx.translate(q[0] - P.x + W / 2, gy + 4 + q[1]); ctx.scale(S * g.F, S); ctx.rotate(q[2]);

                });

        // ================= HEAD SHATTER (shotgun headshot) =================
        const gibs = [];

        function neckAttach(e, lx) {          // neck-stump point (world), follows the body's lean + rotation
            const S = CSc(), h = e.nkP || [0, -97], th = e.rot || 0, py = -22, c = Math.cos(th), s = Math.sin(th), dx = h[0] + lx, dy = h[1] - py;
            return [e.x + S * (dx * c - dy * s), S * (py + dx * s + dy * c)];
        }

        function headShatter(e, F, d) {

            e.hp = 0; e.dying = 9; e.hsDead = 1; e.hsT = 0; e.bar = 0; e.hurt = 0; e.kdir = F; e.face = -F; e.wait = 1; e.fid = 0;
            e.vx = F * (d < 260 ? 400 : 230); e.stab = 0; e.kneelK = 0; e.brainOut = 1;
            for (let i = knives.length - 1; i >= 0; i--) if (knives[i].st === e) knives.splice(i, 1);

                k: 0, x: hw[0] + (Math.random() - .5) * 26 * S, y: Math.min(-8, hw[1] + (Math.random() - .5) * 26 * S),
                vx: F * (260 + Math.random() * 620) + (Math.random() - .5) * 320, vy: -(120 + Math.random() * 520),
                rot: Math.random() * 6, vr: (Math.random() - .5) * 28, s: (9 + Math.random() * 10) * S, seed: Math.random() * 100, bn: 0, landed: false, t: 0, bl: 0
            });

                x: hw[0] + (Math.random() - .5) * 34 * S, y: Math.min(-6, hw[1]) - Math.random() * 14 * S,
                vx: F * (80 + Math.random() * 520) + (Math.random() - .5) * 360, vy: -(100 + Math.random() * 460),
                r: (3.5 + Math.random() * 6) * S, rot: Math.random() * 6, vr: (Math.random() - .5) * 18,

                e.veins.push({

                });
            }

            burst(hw[0], hw[1], 50, 520, F); burst(hw[0], hw[1], 20, 300, -F);
            impacts.push({ x: hw[0], y: hw[1], t: 0, life: .35, s: 190, seed: Math.random() * 50 });
            streaks.push({ x0: e.x + F * 20, x1: e.x + F * 220, off: 0, dy: 9, w: 14, live: false, t: .5, seed: Math.random() * 100 });

        }

        function stepVeins(e, dt) {
            const S = CSc(), sub = 3, h = dt / sub, floor = -4 * S;
            if ((e.hsT || 0) < 4) {                                   // arterial spurts from the stump, fading out
                e.spurt = (e.spurt || 0) - dt;
                if (e.spurt <= 0) {
                    e.spurt = .05; const A = neckAttach(e, 0), k = 1 - e.hsT / 4, pulse = Math.max(0, Math.sin(e.hsT * 9));
                    spray(A[0], A[1], 2, 140 + 330 * k * (.3 + pulse), (Math.random() - .5) * 2);
                }
            }
            for (const v of e.veins) {
                const Q = v.p, N = Q.length, rest = v.rest;
                for (let s = 0; s < sub; s++) {
                    for (let i = 1; i < N; i++) { const p = Q[i], vx = (p.x - p.ox) * .98, vy = (p.y - p.oy) * .98; p.ox = p.x; p.oy = p.y; p.x += vx; p.y += vy + 1800 * h * h }
                    for (let it = 0; it < 6; it++) {
                        const A = neckAttach(e, v.lx); Q[0].x = A[0]; Q[0].y = A[1]; Q[0].ox = A[0]; Q[0].oy = A[1];
                        for (let i = 0; i < N - 1; i++) {
                            const a = Q[i], b = Q[i + 1], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .0001, k = (d - rest) / d * .5;
                            if (i === 0) { b.x -= dx * k * 2; b.y -= dy * k * 2 } else { a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k }
                        }
                        for (let i = 1; i < N; i++) { const p = Q[i]; if (p.y > floor) { p.y = floor; p.ox += (p.x - p.ox) * .5 } }
                    }
                }
                if (e.hsT < 6 && Math.random() < dt * 5) {             // drip from the dangling tips
                    const t = Q[N - 1]; blood.push({ x: t.x, y: t.y, vx: (Math.random() - .5) * 14, vy: 10 + Math.random() * 20, r: 1.3 + Math.random() * 1.4, t: 0 });
                }
            }
        }

        function drawVeins(gy) {
            const S = CSc();
            for (const e of ENEMIES) {
                if (!e.veins || e.dead > 0) continue;
                for (const v of e.veins) {
                    const p = v.p; if (Math.abs(p[0].x - P.x) > W / 2 + 300) continue;
                    const X = q => q.x - P.x + W / 2, Y = q => gy + 4 + q.y;

        function gibTick(dt) {
            for (let i = gibs.length - 1; i >= 0; i--) {
                const g = gibs[i];
                if (!g.landed) {
                    g.t += dt; g.vy += 1500 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.vr * dt;
                    g.bl -= dt; if (g.bl <= 0 && g.t < 1.4) { g.bl = .04; blood.push({ x: g.x, y: g.y, vx: g.vx * .1 + (Math.random() - .5) * 30, vy: 10 + Math.random() * 30, r: 1.2 + Math.random() * 1.5, t: 0 }) }
                    if (g.y >= -g.s * .3) {
                        g.y = -g.s * .3;
                        if (Math.abs(g.vy) > 180 && g.bn < 3) {
                            g.vy *= -.38; g.vx *= .62; g.vr *= .6; g.bn++;
                            burst(g.x, -2, 4, 140, Math.sign(g.vx) || 1);
                            if (splats.length < 160) splats.push({ x: g.x, w: g.s * .8, h: g.s * .22, t: 0 });
                        } else { g.landed = true; g.t = 0; g.vx = 0; g.rot = Math.round(g.rot / Math.PI) * Math.PI }
                    }

        function drawGibs(gy) {
            ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            for (const g of gibs) {
                const sx = g.x - P.x + W / 2; if (sx < -60 || sx > W + 60) continue;
                ctx.globalAlpha = g.landed ? Math.min(1, (16 - g.t) / 3) : 1;
                ctx.save(); ctx.translate(sx, gy + 4 + g.y); ctx.rotate(g.rot);
                const r = g.s;
                if (g.k === 0) {                                          // skull shard: bone outside, bloody flesh inside
                    const poly = sc => { ctx.beginPath(); for (let j = 0; j < 5; j++) { const a = j / 5 * Math.PI * 2, rr = r * sc * (.55 + .6 * hash(g.seed + j * 3)); const x = Math.cos(a) * rr * 1.2, y = Math.sin(a) * rr * .8; j ? ctx.lineTo(x, y) : ctx.moveTo(x, y) } ctx.closePath() };
                    poly(1); ctx.fillStyle = '#ebe5d6'; ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.stroke();
                    poly(.6); ctx.fillStyle = '#a8261f'; ctx.fill(); ctx.strokeStyle = '#5a0a10'; ctx.lineWidth = 1.2; ctx.stroke();
                } else if (g.k === 1) {                                   // jawbone with teeth
                    ctx.strokeStyle = '#111'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 0, r, .15, Math.PI - .15); ctx.stroke();
                    ctx.strokeStyle = '#ebe5d6'; ctx.lineWidth = 3.4; ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1;

        // ================= HORSE (mount, ride, jump, trample) =================
        const HR_MOUNT_R = 170, HR_SEAT = -220, HR_WALK = 215, HR_RUN = 790, HR_JUMP = 640, HR_REAR_T = 1.0;
        const HRS = { x: 480, vx: 0, z: 0, vz: 0, face: -1, ph: 0, amp: 0, rg: 0, home: 480, goal: 480, wait: 2, gz: 0, gT: 3, gk: 0, rear: 0, muz: null };
        P.mount = 0; P.mountT = 0; P.mx0 = 0; P.mk = 0;   // mount: 0 off, 1 climbing on, 2 riding, 3 climbing off
        const clamp01 = v => Math.max(0, Math.min(1, v));

        function horseTick(dt) {

                        -3,
                        8,

                P.vx = h.vx;
                P.face = h.face;

        // two-bone leg IK for the horse: returns [kneeX, kneeY, ankleX, ankleY]; bend +1 = knee forward, -1 = hock backward
        function hrsLegIK(ax, ay, fx, fy, bend) {
            const A1 = 62, A2 = 60, dx = fx - ax, dy = fy - ay, d = Math.hypot(dx, dy) || 1, dm = Math.min(d, A1 + A2 - .5), ux = dx / d, uy = dy / d;

                0
            );

            hoof(near);


            ctx.restore();


            // ============================================================
            // MOUNT HINT
            // ============================================================

            if (
                !P.mount &&
                Math.abs(h.x - P.x) <
                HR_MOUNT_R * S
            ) {

                ctx.save();

                ctx.fillStyle = '#111';

                ctx.font =
                    'italic bold 22px Georgia,serif';

                ctx.textAlign = 'center';

                ctx.fillText(
                    'H',
                    sx,
                    gy - 235 * S -
                    4 * Math.sin(now * 5)
                );

                ctx.restore();
            }
        }



        function drawReins(F) {          // called inside drawChar (character space): thin line from his fist to the bit
            const A = P.armPts && P.armPts[0]; if (!A || !HRS.muz) return;
            const w = A[1], mx = F * HRS.muz[0], my = HRS.muz[1] + HRS.z / CSc();
            ctx.save(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(w[0], w[1]); ctx.quadraticCurveTo((w[0] + mx) / 2, Math.max(w[1], my) + 10, mx, my); ctx.stroke(); ctx.restore();
        }

        // ================= FINGER SPIN / HOLSTER =================
        const TAU = Math.PI * 2;
        P.gs = 0;        // 0 none, 1 idle spin, 2 spin-to-holster
        P.gsT = 0; P.gsA = 0; P.gsK = 0; P.gsIdle = 0; P.gsAt = 3; P.gsEnd = 0; P.gsFast = 0; P.gsDur = 2;
        P.gsFrom = 0; P.gsTo = 0; P.gdT = 1; P.q = 0; P.qT = 0; P.hol = null;

        function gStill() { return P.z >= 0 && Math.abs(P.vx) < 8 && !(P.cs > 0 || P.fin > 0 || P.thw > 0 || P.tt > 0 || P.kt > .05 || P.skid || P.abuf > 0 || P.sm > 0) }
        function startSpin() { P.gs = 1; P.gsT = 0; P.gsA = 0; P.gsEnd = 0; P.gsFast = 0; P.gsDur = 2 + Math.random() * 1.5 }

        function spinTick(dt) {
            P.gdT = Math.min(1, P.gdT + dt);
            if (P.q) { P.qT -= dt; if (P.qT <= 0) P.q = 0 }
            if (!P.gun && P.gs !== 2) { P.gs = 0; P.gsA = 0; P.gsIdle = 0; P.q = 0; P.gsK += (0 - P.gsK) * Math.min(1, dt * 14); return }

            if (P.gs === 2) {                                   // spin-to-holster
                P.gsT += dt;
                const u = Math.min(1, P.gsT / .45);
                P.gsA = P.gsFrom + (P.gsTo - P.gsFrom) * (1 - (1 - u) * (1 - u));
                if (P.gsT < 0.75) {
                    P.gsK += (1 - P.gsK) * Math.min(1, dt * 12);
                } else {
                    P.gsK += (0 - P.gsK) * Math.min(1, dt * 10);
                    if (P.gun) { P.gun = 0; P.gunK = 0; P.rl = 0; }
                }
                if (P.gsT >= 1.05) { P.gs = 0; P.gsA = 0; P.gsK = 0; P.gun = 0; P.gunK = 0; P.rl = 0 }
                return;
            }

            const calm = P.gunK > .9 && gStill() && P.rl <= 0 && P.fireCd <= 0 && P.recoil < .1 && !(keys.KeyW || keys.KeyS || keys.ArrowUp || keys.ArrowDown);
            if (P.gs === 0) {
                P.gsK += (0 - P.gsK) * Math.min(1, dt * 12);
                if (!calm) { P.gsIdle = 0; return }
                P.gsIdle += dt;
                if (P.gsIdle >= P.gsAt) startSpin();
                return;
            }
            // idle spin
            P.gsK += (1 - P.gsK) * Math.min(1, dt * 9);
            P.gsT += dt;
            if (!calm) { P.gsEnd = 1; P.gsFast = 1 }
            if (P.gsT > P.gsDur) P.gsEnd = 1;
            if (!P.gsEnd) {
                P.gsA += 13 * sm(P.gsT / .4) * dt;               // winds up to about 2 turns a second
            } else {                                            // finish the current turn so the barrel ends pointing forward
                const tgt = Math.ceil(P.gsA / TAU - 1e-6) * TAU, rem = tgt - P.gsA;
                const w = P.gsFast ? 28 : Math.max(2.6, Math.min(12, rem * 9));
                P.gsA = Math.min(tgt, P.gsA + w * dt);
                if (P.gsA >= tgt - 1e-4) {
                    P.gs = 0; P.gsA = 0; P.gsIdle = 0; P.gsAt = 2.5 + Math.random() * 2.5;
                    if (P.q) { const q = P.q; P.q = 0; if (q === 1) pressFire(); else pressReload() }
                }
            }
        }

        function drawHolster(h, F, grip) {      // h = [x, y, bodyLean] at the holster mouth
            ctx.save(); ctx.translate(h[0], h[1]); ctx.rotate(h[2]); ctx.scale(F, 1); ctx.rotate(.33);
            ctx.lineJoin = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = '#111';
            if (grip) {
                ctx.fillStyle = '#6f737a'; ctx.beginPath(); ctx.rect(-5, -12, 11, 13); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#9a4a1a'; ctx.beginPath(); ctx.moveTo(-5, -12); ctx.lineTo(-16, -9); ctx.lineTo(-14, 0); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            ctx.fillStyle = '#4a3322'; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(6, 22); ctx.quadraticCurveTo(0, 27, -6, 22); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#c99a3a'; ctx.beginPath(); ctx.arc(0, 5, 1.6, 0, 7); ctx.fill();
            ctx.restore();
        }


        function frame(now) {


            const dt0 = Math.min(.033, (now - last) / 1000); last = now;
            let dt = dt0;
            if (hitstop > 0) { hitstop -= dt0; dt = 0 }

            update(dt); for (const e of ENEMIES) updateEnemy(e, dt); updateKnives(dt); updateGroundKnives(dt); gunTick(dt); sgTick(dt); sgGroundTick(dt); spinTick(dt); smokeTick(dt); bloodFX(dt); brainTick(dt); gibTick(dt); weatherTick(dt); horseTick(dt);
            shake = Math.max(0, shake - dt0 * 60);
            ctx.save();
            if (shake > .3) ctx.translate((Math.random() - .5) * shake * 1.6, (Math.random() - .5) * shake * 1.6);
            ctx.fillStyle = paper; ctx.fillRect(-60, -60, W + 120, H + 120);
            const gy = groundY();
            drawBackdrop(gy);
            drawWorld(gy);
            drawSkid(gy);
            drawSplats(gy);
            drawButts(gy);
            drawGhosts(gy);
            drawSgProp(gy, false);
            drawEnemies(gy);
            drawGutFX(gy);
            drawIntestines(gy);
            drawCords(gy);
            drawVeins(gy);
            drawBrainBits(gy);
            drawGibs(gy);
            drawFootKnives(gy);
            drawKnives(gy);
            drawShots(gy);
            drawPellets(gy);
            drawHorse(gy);
            drawChar(W / 2, gy, P);
            drawSgProp(gy, true);
            drawSmoke(gy);
            drawBlood(gy);
            drawWeather(gy);
            ctx.restore();
            ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
            drawHUD();
            drawGunHUD();
            drawShotgunHUD();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
