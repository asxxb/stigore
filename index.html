<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ink Walker</title>
    <style>
        :root {
            --paper: #e4e2de;
            --ink: #111;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--paper);
            overflow: hidden;
            touch-action: none
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%
        }

        #hud {
            position: fixed;
            left: 14px;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            font: 15px/1.4 Georgia, serif;
            color: #222;
            opacity: .7;
            pointer-events: none
        }

        .btns {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 18px
        }

        .btns div {
            display: flex;
            gap: 12px
        }

        .b {
            width: 68px;
            height: 68px;
            border: 3px solid #111;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            font: 28px Georgia, serif;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none
        }

        @media (pointer:coarse) {
            .btns {
                display: flex
            }
        }

        @media (max-width:420px) {
            .b {
                width: 56px;
                height: 56px;
                font-size: 24px
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="hud">A / D or ← → to walk · Shift to run · Space to jump · Shift+Space (running): parkour tumble · K: knife
        · J: stab · L: throw · M: front kick to the stomach · V: man / woman
    </div>
    <div class="btns">
        <div><span class="b" id="bl">◀</span><span class="b" id="br">▶</span></div>
        <div><span class="b" id="bp">J</span><span class="b" id="bk">K</span><span class="b" id="bj">▲</span></div>
        <span class="b" id="bd"
            style="position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 98px)">▼</span>
        <span class="b" id="bh"
            style="position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 178px)">H</span>
        <span class="b" id="bv"
            style="position:fixed; left:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 98px)">♀</span>
        <span class="b" id="bm"
            style="position:fixed; left:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 178px)">M</span>
    </div>
    <script>
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        let W, H, DPR, paper, vig;
        const BLD = 1.3;   // building size multiplier: 1 = current size, 1.3 = 30% bigger, 1.6 = much bigger

        let vigN;
        const nightC = document.createElement('canvas'), nctx = nightC.getContext('2d');
        function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s) }
        function makePaper() {
            const p = document.createElement('canvas'); p.width = p.height = 512; const g = p.getContext('2d');
            g.fillStyle = '#e6e4e0'; g.fillRect(0, 0, 512, 512);
            const id = g.getImageData(0, 0, 512, 512), d = id.data;
            for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 26; d[i] += n; d[i + 1] += n; d[i + 2] += n }
            g.putImageData(id, 0, 0);
            g.globalAlpha = .05; g.strokeStyle = '#777';
            for (let i = 0; i < 260; i++) { g.beginPath(); const x = Math.random() * 512, y = Math.random() * 512; g.moveTo(x, y); g.lineTo(x + Math.random() * 10 - 5, y + Math.random() * 10 - 5); g.stroke() }
            paper = ctx.createPattern(p, 'repeat');
        }



        let ZOOM = 0.4;   // 1 = current size, 0.5 = same as browser zoom 50%, 0.75 = in between
        function resize() {
            DPR = Math.min(devicePixelRatio || 1, 2);
            W = innerWidth / ZOOM; H = innerHeight / ZOOM;                    // game units: bigger world on screen
            cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;       // real pixels stay the same
            ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, 0, 0);
            vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .8);
            vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(60,50,40,.28)');
            nightC.width = innerWidth * DPR; nightC.height = innerHeight * DPR; nctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, 0, 0);
            vigN = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .22, W / 2, H / 2, Math.max(W, H) * .75);
            vigN.addColorStop(0, 'rgba(0,0,0,0)'); vigN.addColorStop(1, 'rgba(4,5,12,.6)');
        }



        makePaper(); resize(); addEventListener('resize', resize);

        const keys = {};
        addEventListener('keydown', e => {
            keys[e.code] = 1;
            if (e.code === 'Space') e.preventDefault();
            if (e.repeat) return;
            if (e.code === 'KeyV') { P.female = !P.female; banner.t = .8; banner.text = P.female ? 'WOMAN' : 'MAN'; }
            if (e.code === 'KeyC') pressSmoke();
            if (e.code === 'KeyN') { const toNight = DN.d < .5; DN.t = toNight ? 0 : .5; banner.t = .8; banner.text = toNight ? 'MIDNIGHT' : 'NOON'; }
            if (e.code === 'KeyO') pressLantern();
            if (P.sm === 1 || P.ln > 0 || P.lb > 0) return;
            if (P.sgp > 0) return;    // no actions mid-stomp
            if (e.code === 'KeyG') pressG();
            if (e.code === 'KeyH') pressHorse();
            if (e.code === 'KeyF') pressFire();
            if (e.code === 'KeyZ') pressSgDraw();
            if (e.code === 'KeyB') pressSgFire(true);
            if (e.code === 'KeyR') pressReload();
            if (e.code === 'KeyK') pressK();
            if (e.code === 'KeyL') pressThrow();
            if (e.code === 'KeyE') pressFinish();
            if (e.code === 'Space') pressJump();
            if (e.code === 'KeyJ') pressAtk();
            if (e.code === 'KeyM') pressKick();
        });
        addEventListener('keyup', e => keys[e.code] = 0);
        function hold(id, k) {
            const el = document.getElementById(id);
            ['pointerdown'].forEach(t => el.addEventListener(t, e => { e.preventDefault(); keys[k] = 1 }));
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, () => keys[k] = 0));
        }
        hold('bl', 'ArrowLeft'); hold('br', 'ArrowRight'); hold('bj', 'Space'); document.getElementById('bk').addEventListener('pointerdown', e => { e.preventDefault(); pressK() });
        document.getElementById('bj').addEventListener('pointerdown', pressJump);
        hold('bd', 'ArrowDown');
        document.getElementById('bp').addEventListener('pointerdown', e => { e.preventDefault(); pressAtk() });
        document.getElementById('bh').addEventListener('pointerdown', e => { e.preventDefault(); pressHorse() });
        document.getElementById('bv').addEventListener('pointerdown', e => { e.preventDefault(); P.female = !P.female });
        const bmBtn = document.getElementById('bm');
        if (bmBtn) {
            ['pointerdown', 'click'].forEach(evt => bmBtn.addEventListener(evt, e => {
                e.preventDefault();
                pressKick();
            }));
        }


        const P = {
            gk: 0, x: 0, vx: 0, z: 0, vz: 0, face: 1, phase: 0, dist: 0, atk: 0, kn: 0, kt: 0, amp: 0, lean: 0, tt: 0, rv: 0,
            jbuf: 0, coy: 0, cs: 0, ct: 0, chit: false, abuf: 0, clast: 0, cgr: 0, gt: 0, grabbed: null,
            skid: 0, skidDir: 1, skidK: 0, skA: 0, sk: null,
            idle: 0, idleAt: 3.5, fid: 0, fidType: 0, fidT: 0, fidDur: 2.4, fidK: 0,
            pk: 0, pkT: 0, pkDir: 1, pkHit: [0, 0, 0]
        };
        // knife states: kn 0 = away, 1 = forward grip, 2 = reverse grip (blade to the back)
        let CUR = P; const PL = P;   // CUR = character being drawn/animated (player or NPC)
        P.thw = 0; P.thr = 0;           // throw timer / released flag
        P.female = false;
        P.stbk = 0; P.stbHit = false;  // knife stab timer / hit flag
        P.fin = 0; P.finE = null; P.finDone = 0;
        const THR_T = .32;              // throw animation length
        const knives = [];
        const THROW_RANGE = 650;   // max distance (px) a thrown knife can fly before it drops
        const PICKUP_R = 70;       // how close you need to be to grab a knife (scaled)
        let hasKnife = true;       // you only own one knife now
        const groundKnives = [];
        const TOSS_T = .95;
        function pressK() {
            if (P.mount) { banner.t = .6; banner.text = 'DISMOUNT FIRST (H)'; return }
            if (P.thw > 0 || P.fin > 0 || P.pk > 0) return;
            if (P.gun || P.gs === 2 || P.sg) { banner.t = .6; banner.text = 'HOLSTER GUN FIRST (G)'; return }
            P.idle = 0; P.fid = 0;
            if (P.tt > 0) return;
            if (P.kn === 0) {
                if (!hasKnife) { banner.t = .6; banner.text = 'NO KNIFE!'; return }
                P.kn = 1; P.rv = 0
            }
            else if (P.kn === 1) { if (P.kt > .95) P.tt = .0001 }
            else P.kn = 0;
        }

        let last = performance.now();
        function groundY() { return H * 0.76 }

        // ---- movement feel tuning ----
        const GRAV = 1700;
        const JUMP_V = 540;
        const CUT_MULT = 6;
        const COYOTE = .1;
        const BUFFER = .1;
        const SKID_MIN = 280;
        const SKID_END = 60;
        const SKID_ACC = 1300;
        const IDLE_MIN = 3, IDLE_MAX = 6;
        function pressJump() { P.jbuf = BUFFER }

        // ---- ink skid marks + flecks + ghost afterimages (world space) ----
        const streaks = [], flecks = [], ghosts = [], impacts = [];
        function startSkid(d) {
            P.skid = 1; P.skidDir = d; P.face = d; P.skA = 0;
            const S = CSc(), mk = (off, dy, w) => { const x = P.x + d * off * S, st = { x0: x, x1: x, off, dy, w, live: true, t: 0, seed: Math.random() * 100 }; streaks.push(st); return st };
            P.sk = [mk(62, 5.5, 8), mk(14, 9.5, 5.5)];
        }
        function endSkid() { P.skid = 0; if (P.sk) for (const s of P.sk) s.live = false; P.sk = null }
        function skidFX(dt) {
            const S = CSc();
            if (P.skid) {
                for (const s of P.sk) s.x1 = P.x + P.skidDir * s.off * S;
                P.skA += dt;
                while (P.skA > .03) {
                    P.skA -= .03;
                    flecks.push({ x: P.x + P.skidDir * 62 * S, y: -2, vx: P.skidDir * (40 + Math.random() * 120), vy: -(60 + Math.random() * 180), r: 1 + Math.random() * 2, t: 0, life: .35 + Math.random() * .3 })
                }
            }
            for (let i = flecks.length - 1; i >= 0; i--) { const f = flecks[i]; f.t += dt; f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.t > f.life || f.y > 0) flecks.splice(i, 1) }
            for (let i = impacts.length - 1; i >= 0; i--) { impacts[i].t += dt; if (impacts[i].t >= impacts[i].life) impacts.splice(i, 1) }
            for (let i = streaks.length - 1; i >= 0; i--) { const s = streaks[i]; if (!s.live) { s.t += dt; if (s.t > 3.4) streaks.splice(i, 1) } }
            for (let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.t += dt; if (g.t >= g.life) ghosts.splice(i, 1) }
        }
        function addGhost(P, pose) {
            if (ghosts.length > 14) ghosts.shift();
            ghosts.push({
                x: P.x, z: P.z, face: P.face, rot: P.rot || 0, py: (pose && pose.py !== undefined) ? pose.py : undefined,
                pose: {
                    a0: pose.a0, f0: pose.f0, a1: pose.a1, f1: pose.f1,
                    lean: pose.lean, hipX: pose.hipX, hipY: pose.hipY,
                    arch: pose.arch, hx: pose.hx, hy: pose.hy,
                    l0: [...pose.l0], l1: [...pose.l1]
                },
                t: 0, life: 0.22, alpha: 0.44
            });
        }
        function drawGhosts(gy) {
            const S = CSc();
            for (const g of ghosts) {
                const sx = g.x - P.x + W / 2;
                if (Math.abs(sx - W / 2) > W / 2 + 150) continue;
                const a = Math.max(0, (1 - g.t / g.life) * g.alpha);
                if (a <= 0.01) continue;
                const F = g.face, pose = g.pose;
                ctx.save(); ctx.translate(sx, gy + 4); ctx.scale(S, S); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                const z = g.z / S, hipY = -(ANK + 120) + z + (pose.hipY || 0);
                if (g.rot) {
                    const pk = Math.min(1, -z / 60);
                    const py = (g.py !== undefined) ? g.py : (-40 * (1 - pk) + ((pose.hipY || 0) - 30) * pk);
                    ctx.translate(0, py); ctx.rotate(g.rot); ctx.translate(0, -py);
                }
                ctx.globalAlpha = a * 0.75; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
                const hipX = F * (pose.hipX || 0), l = F * pose.lean;
                const rot = (x, y) => [hipX + x * Math.cos(l) - y * Math.sin(l), hipY + x * Math.sin(l) + y * Math.cos(l)];
                const nk = rot(0, -T), cp = rot(-F * (9 + (pose.arch || 0) * 28), -T / 2);
                for (let i = 1; i >= 0; i--) {
                    const targetL = i === 0 ? pose.l0 : pose.l1, fx = hipX + F * targetL[0], fy = (P && P.pk > 0) ? targetL[1] : (targetL[1] - (targetL[2] || 0));
                    const ax = fx, ay = fy - ANK, dx = ax - hipX, dy = ay - hipY, dd = Math.hypot(dx, dy);
                    const d = Math.min(dd, 2 * L1 - 0.5), ux0 = dx / (dd || 1), uy0 = dy / (dd || 1), mx = hipX + ux0 * d / 2, my = hipY + uy0 * d / 2;
                    const h = Math.sqrt(Math.max(0, L1 * L1 - d * d / 4));
                    let nx = -uy0, ny = ux0;
                    if (dx * F < -15) { if (nx * F > 0) { nx = -nx; ny = -ny } }
                    else { if (nx * F < 0) { nx = -nx; ny = -ny } }
                    const kx = mx + nx * h, ky = my + ny * h;
                    ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.lineTo(ax, ay); ctx.stroke();
                    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 7); ctx.fill();
                }
                ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.quadraticCurveTo(cp[0], cp[1], nk[0], nk[1]); ctx.stroke();
                if (P === PL) { const hp = rot(F * 8, -14); drawHolster([hp[0], hp[1], l], F, (!P.gun && P.gs !== 2) || (P.gs === 2 && P.gsT >= 0.75)) }
                const sh = rot(0, -T + 10);
                for (let i = 0; i < 2; i++) {
                    const ang = i ? pose.a1 : pose.a0, flex = i ? pose.f1 : pose.f0, d1 = [Math.sin(ang) * F, Math.cos(ang)], el = [sh[0] + d1[0] * 58, sh[1] + d1[1] * 58];
                    const d2 = [Math.sin(ang + flex) * F, Math.cos(ang + flex)], wr = [el[0] + d2[0] * 56, el[1] + d2[1] * 56];
                    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(el[0], el[1]); ctx.lineTo(wr[0], wr[1]); ctx.stroke();
                    ctx.beginPath(); ctx.arc(wr[0], wr[1], 4.5, 0, 7); ctx.fill();
                }
                const hd = rot(-F * 7 + F * (pose.hx || 0), -T - 24 + (pose.hy || 0));
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hd[0], hd[1], 23, 0, 7); ctx.stroke();
                ctx.restore();
            }
        }
        function drawSkid(gy) {
            ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
            for (const s of streaks) {
                const a = s.live ? 1 : 1 - sm(Math.max(0, s.t - 1.2) / 2.2);
                const sx0 = s.x0 - P.x + W / 2, sx1 = s.x1 - P.x + W / 2, len = Math.abs(sx1 - sx0);
                if (len < 3 || a <= 0) continue;
                const dr = Math.sign(sx1 - sx0), y = gy + s.dy;
                for (let d = 0; d < len; d += 10) {
                    const i = d / 10, e = Math.min(len, d + 10);
                    ctx.globalAlpha = a * (.55 + .45 * hash(s.seed + i));
                    ctx.lineWidth = s.w * (.3 + .7 * Math.min(1, d / 60)) * (.8 + .4 * hash(s.seed + i * 3));
                    ctx.beginPath(); ctx.moveTo(sx0 + dr * d, y + (hash(s.seed + i * 7) - .5) * 1.6); ctx.lineTo(sx0 + dr * e, y + (hash(s.seed + i * 7 + 1) - .5) * 1.6); ctx.stroke();
                }
            }
            for (const m of impacts) {
                const k = m.t / m.life, sx = m.x - P.x + W / 2, sy = gy + 4 + m.y; ctx.globalAlpha = 1 - k * k;
                for (let i = 0; i < 12; i++) {
                    const ang = i / 12 * Math.PI * 2 + hash(i + m.seed) * .3, r0 = m.s * .15 * (1 + k), r1 = m.s * (.35 + .5 * hash(i * 2.3 + m.seed)) * (.4 + .9 * Math.min(1, k * 2));
                    ctx.lineWidth = Math.max(1, 6 * (1 - k) * (.5 + hash(i))); ctx.beginPath(); ctx.moveTo(sx + Math.cos(ang) * r0, sy + Math.sin(ang) * r0); ctx.lineTo(sx + Math.cos(ang) * r1, sy + Math.sin(ang) * r1); ctx.stroke()
                }
            }
            for (const f of flecks) { ctx.globalAlpha = Math.max(0, 1 - f.t / f.life); ctx.beginPath(); ctx.arc(f.x - P.x + W / 2, gy + 4 + f.y, f.r, 0, 7); ctx.fill() }
            ctx.restore();
        }

        // ---- idle fidgets ----
        function startFidget(q) {
            q.fid = 1; q.fidT = 0;
            const canStretch = q.kn === 0 && q.kt < .05;
            q.fidType = (canStretch && Math.random() < .5) ? 2 : 1;
            q.fidDur = q.fidType === 2 ? 2.4 : 2.8;
            q.idleAt = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
        }
        function fidgetTick(q, busy, dt) {
            if (busy) { q.idle = 0; q.fid = 0 }
            else if (q.fid) { q.fidT += dt; if (q.fidT >= q.fidDur) { q.fid = 0; q.idle = 0 } }
            else { q.idle += dt; if (q.idle >= q.idleAt) startFidget(q) }
            q.fidK += ((q.fid ? 1 : 0) - q.fidK) * Math.min(1, dt * (q.fid ? 8 : 12));
            if (!q.fid && q.fidK < .01) { q.fidK = 0; q.fidT = 0 }
        }
        function lookCurve(u) {
            const k = [[0, 0], [.18, -1], [.42, -1], [.6, .9], [.8, .9], [1, 0]];
            for (let i = 1; i < k.length; i++)if (u <= k[i][0]) { const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * sm((u - a[0]) / (b[0] - a[0])) }
            return 0;
        }
        function stretchEnv(u) { return u < .25 ? sm(u / .25) : u < .75 ? 1 : 1 - sm((u - .75) / .25) }

        function update(dt) {
            if (typeof updateSwim === 'function' && updateSwim()) {
                P.vz = 0; P.z = 0;
                return;
            }
            if (P.pk > 0) {
                parkourTick(dt);
                if (P.atk > 0) P.atk -= dt;
                comboTick(dt);
                stabTick(dt);
                fidgetTick(P, true, dt);
                return;
            }
            const dir = (P.fin > 0 || P.sm === 1 || P.ln > 0 || P.lb > 0 || P.fs > 0 || P.yk > 0 || P.gu > 0 || P.sgp > 0 || P.mount) ? 0 : (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
            const run = keys.ShiftLeft || keys.ShiftRight;
            const max = run ? 520 : 190;
            const grounded = P.z >= 0;
            const acc = grounded ? 900 : 300;

            // ---- skid turn: reversing at a run ----
            const vs = Math.sign(P.vx);
            if (P.skid) { if (!grounded || !dir || dir === vs || Math.abs(P.vx) < SKID_END) endSkid() }
            else if (grounded && dir && vs && dir !== vs && Math.abs(P.vx) >= SKID_MIN && !P.cs) startSkid(vs);

            if (dir && !P.cs) {
                if (P.skid) P.vx += dir * SKID_ACC * dt;
                else { P.vx += dir * acc * dt; if (P.skidK < .25) P.face = dir }
            }
            else if (grounded) { const f = 1400 * dt; P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f }
            const lim = max; if (Math.abs(P.vx) > lim) P.vx += (Math.sign(P.vx) * lim - P.vx) * Math.min(1, dt * 8);
            if (!P.mount) P.x += P.vx * dt;

            // ---- parkour tumbling pass: Sprint + Jump at speed ----
            const isSprinting = run && Math.abs(P.vx) > 220;
            if (P.jbuf > 0 && isSprinting && grounded && !P.pk && !P.mount && !P.cs && !P.fin && !P.stbk && !P.sg) {
                startParkour(vs || P.face || 1);
                P.jbuf = 0;
            }

            // ---- jump: buffering + coyote time + variable height ----
            if (grounded) P.coy = COYOTE; else P.coy = Math.max(0, P.coy - dt);
            if (P.jbuf > 0) {
                if ((grounded || P.coy > 0) && !P.cs && !P.fin && !P.pk && !(P.yk > 0) && !(P.gu > 0) && !(P.sgp > 0) && !P.mount) { P.vz = -JUMP_V; P.jbuf = 0; P.coy = 0; P.grabbed = null; P.clast = 0 }// jumping breaks the clinch
                else P.jbuf = Math.max(0, P.jbuf - dt);
            }
            const g = GRAV * (P.vz < 0 && !keys.Space ? CUT_MULT : 1);
            if (P.vz !== 0 || P.z < 0) {
                P.vz += g * dt; P.z += P.vz * dt;
                if (P.z >= 0) {

        // ================= BARN (fixed landmark, right side of world) =================

        // ================= BACKDROP (ink sketch, parallax) =================

        function drawWorld(gy) {
            const cam = P.x;
            ctx.save(); ink(2); ctx.globalAlpha = .35;
            const pf = .35, span = 380;
            const start = Math.floor((cam * pf - W / 2) / span) - 1;
            for (let i = start; i < start + Math.ceil(W / span) + 3; i++) {
                const x = W / 2 + i * span - cam * pf + hash(i) * 120, y = gy - 150 - hash(i + 9) * 160;
                ctx.beginPath(); const r = 20 + hash(i + 3) * 30;
                ctx.moveTo(x - r * 2, y); ctx.bezierCurveTo(x - r * 2, y - r, x - r * .5, y - r * 1.4, x, y - r * .6);
                ctx.bezierCurveTo(x + r * .8, y - r * 1.5, x + r * 2, y - r * .7, x + r * 2, y); ctx.stroke();
            }
            ctx.restore();
            ctx.save(); ink(4);
            ctx.beginPath();
            for (let sx = -20; sx <= W + 20; sx += 12) {
                const wx = sx + cam; const y = gy + 4 + Math.sin(wx * .013) * 2 + (hash(Math.floor(wx / 12)) - .5) * 2;
                sx === -20 ? ctx.moveTo(sx, y) : ctx.lineTo(sx, y)
            }
            ctx.stroke();
            const gs = 90, g0 = Math.floor((cam - W / 2) / gs) - 1;
            for (let i = g0; i < g0 + Math.ceil(W / gs) + 3; i++) {
                const wx = i * gs + hash(i * 3) * 60, sx = wx - cam + W / 2, t = hash(i + 50);
                ctx.globalAlpha = .8;
                if (t < .55) {
                    ink(2.5);
                    const nowG = performance.now() / 1000, wk = wind.v / 300;
                    const pd = wx - cam, push = Math.abs(pd) < 90 ? Math.sign(pd || 1) * (1 - Math.abs(pd) / 90) * 18 : 0;   // blades bend away from the player
                    for (let k = -1; k <= 1; k++) {
                        const h = 12 + hash(i + k) * 8, sw = wk * 14 + Math.sin(nowG * 2.6 + wx * .02 + k) * 3 * (.4 + Math.abs(wk)) + push;
                        ctx.beginPath(); ctx.moveTo(sx + k * 5, gy + 8);
                        ctx.quadraticCurveTo(sx + k * 8 + sw * .35, gy - 6, sx + k * 14 + sw, gy - h); ctx.stroke();
                    }
                }
                else if (t < .75) { ink(3); ctx.beginPath(); ctx.ellipse(sx, gy + 2, 14 + hash(i) * 12, 9, 0, Math.PI, 0, true); ctx.stroke() }
                else if (t < .85) {
                    ink(3); ctx.beginPath(); ctx.moveTo(sx, gy + 6); ctx.lineTo(sx + 3, gy - 70); ctx.stroke();
                    ctx.beginPath(); ctx.arc(sx + 3, gy - 85, 15, 0, 7); ctx.stroke();
                }
                else { ink(1.5); ctx.beginPath(); ctx.moveTo(sx, gy + 18); ctx.lineTo(sx + 30 + hash(i) * 30, gy + 20); ctx.stroke() }
            }

            // ================= SINGLE BARN LANDMARK (right side) =================
            {
                const barnWorldX = 2200;   // fixed world position further to the right
                const barnSX = W / 2 + barnWorldX - cam;
                const barnScale = 3.5 * BLD;
                // only draw when vaguely on screen (with generous margin for the barn width)
                if (barnSX > -900 * BLD && barnSX < W + 900 * BLD) {
                    drawBarnBG(gy, barnSX, barnScale);
                }
            }

            // ================= WOODEN HITCHING POST NEXT TO BARN =================
            {
                const hitchSX = W / 2 + 1620 - cam;

                    drawHitchingPost(gy, hitchSX);
                }
            }

            drawBuildings(gy);
            drawForest(gy, 0);

            ctx.restore();
        }

        // ================= KNIFE THROW =================
        function pickTarget(F) {
            let best = null, bd = 1e9;
            for (const e of ENEMIES) {
                if (e.dead > 0 || e.dying > 0) continue;
                const dx = (e.x - P.x) * F, d = Math.abs(e.x - P.x);
                if (dx < -20 || d > W / 2 + 100) continue;
                if (d < bd) { bd = d; best = e }
            }
            return best;

            if (Math.abs(sgCenter(S) - P.x) > SGG_RANGE * S) { banner.t = .8; banner.text = 'WALK TO THE SHOTGUN'; return }
            // start the stomp pickup

            SGG.cx = sgCenter(S);
            P.face = SGG.cx >= P.x ? 1 : -1;

        }

        function dropShotgun() {
            const S = CSc(), F = P.face, w = (P.armPts && P.armPts[0]) ? P.armPts[0][1] : [F * 46, -150];
            Object.assign(SGG, { on: 1, air: 1, bounced: 0, flying: 0, F, x: P.x + w[0] * S, y: w[1] * S, th: P.sgA || 0, vx: F * 170, vy: -230 });
            P.sg = 0; P.srl = 0; P.sgHandT = null; P.idle = 0; P.fid = 0;
        }

        function sgGroundTick(dt) {
            const g = SGG, S = CSc();
            if (!g.on || g.flying) return;
            if (!g.air) { g.y = SG_REST_Y * S; g.th = SG_REST; return }
            g.vy += 1500 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.vx *= Math.max(0, 1 - 2.5 * dt);
            g.th += (SG_REST - g.th) * Math.min(1, dt * 9);
            const rest = SG_REST_Y * S;
            if (g.y >= rest) {
                g.y = rest; burst(g.x, -4, 8, 200, g.F); shake = Math.max(shake, 3);
                if (g.vy > 260 && !g.bounced) { g.vy *= -.28; g.bounced = 1 }
                else { g.vy = 0; g.vx = 0; g.air = 0; g.th = SG_REST }
            }
        }

        function sgpEnv() { const t = P.sgpT; return sm((t - .08) / .3) * (1 - sm((t - SGP_HIT - .1) / .4)) }   // crouch / lean weight

        function sgpFoot(S, fx0, fy0, lf0, F) {      // front foot: chamber up, slam onto the gun, release
            const t = P.sgpT, gx = (SGG.cx - P.x) / S - 3 * F, ux = gx - F * 12, uy = -80;
            if (t < SGP_UP) { const k = sm((t - .05) / (SGP_UP - .05)); return [lerp(fx0, ux, k), lerp(fy0, uy, k), lerp(lf0, 34, k)] }
            if (t < SGP_HIT) { const k = Math.pow(sm((t - SGP_UP) / (SGP_HIT - SGP_UP)), 1.8); return [lerp(ux, gx, k), lerp(uy, -21, k), 34 * (1 - k)] }
            if (t < SGP_HIT + .12) return [gx, -21, 0];
            const k = sm((t - SGP_HIT - .12) / .3);
            return [lerp(gx, fx0, k), lerp(-21, fy0, k), lerp(0, lf0, k)];
        }

        function sgpTick(dt) {
            if (!(P.sgp > 0)) return;
            const S = CSc(), F = P.face, g = SGG;
            P.abuf = 0; P.jbuf = 0;
            if (!g.on) { P.sgp = 0; return }
            if (P.sgpWalk) {                                   // walk up to the gun
                P.sgpWalkT += dt;
                const d = g.cx - F * SGP_STAND * S - P.x;
                if (d * F <= 6 * S || P.sgpWalkT > 1.5) { P.sgpWalk = 0; P.vx = 0 }
                else { P.vx = Math.max(-180, Math.min(180, d * 7)); return }
            }
            P.vx *= Math.max(0, 1 - dt * 14);
            P.sgpT += dt;
            if (!P.sgpHit && P.sgpT >= SGP_HIT) {              // IMPACT: the gun pops out from under his foot
                P.sgpHit = 1;
                g.c0 = [g.cx, g.y + Math.sin(SG_REST) * SG_CEN * S];
                g.F = F; g.flying = 1; g.air = 0; g.tr = []; g.trT = 0;
                burst(g.cx, -4, 14, 300, F); burst(g.cx, -4, 8, 240, -F);
                impacts.push({ x: g.cx, y: -8 * S, t: 0, life: .22, s: 85, seed: Math.random() * 50 });
                shake = Math.max(shake, 9); hitstop = Math.max(hitstop, .06);
                banner.t = .7; banner.text = 'STOMP!';
            }
            if (P.sgpHit) sgpFly(S, dt);
        }

        function sgpFly(S, dt) {                               // flip up, spin once, land in the hand
            const g = SGG, F = P.face, u = Math.min(1, (P.sgpT - SGP_HIT) / SGP_FLY);
            const w = (P.armPts && P.armPts[0]) ? P.armPts[0][1] : [F * 46, -150];
            const ex = P.x + w[0] * S + F * SG_CEN * S, ey = w[1] * S;          // where the gun's centre must be when the hand closes
            const th = SG_REST + (TAU - SG_REST) * Math.sin(u * Math.PI / 2);
            const cx = lerp(g.c0[0], ex, u), cy = lerp(g.c0[1], ey, u) - 230 * S * 4 * u * (1 - u);   // arc well above his head
            g.th = th; g.x = cx - F * Math.cos(th) * SG_CEN * S; g.y = cy - Math.sin(th) * SG_CEN * S;
            g.trT -= dt; if (g.trT <= 0) { g.trT = .035; g.tr.push([g.x, g.y, g.th]); if (g.tr.length > 6) g.tr.shift() }
            if (u > .3) {                                      // off-hand reaches for the forend as it comes down
                const hx = g.x + F * (50 * Math.cos(th) + 6 * Math.sin(th)) * S, hy = g.y + (50 * Math.sin(th) - 6 * Math.cos(th)) * S;
                P.sgHandT = [(hx - P.x) / S, hy / S];
            }
            if (u > .4) P.sg = 1;                              // arms start raising into the aim pose
            if (u >= 1) {                                      // CAUGHT
                g.on = 0; g.flying = 0; P.sg = 1; P.sgp = 0; P.sgpHit = 0;
                shake = Math.max(shake, 5); banner.t = .8; banner.text = 'LOCKED & LOADED';
                burst(P.x + F * 40 * S, -150 * S, 6, 160, F);
            }
        }

        function sgPropBody() {                                // gun drawn around its grip (0,0), same look as the held one

        function drawSgProp(gy, front) {                       // front=false: on the ground (behind the player), front=true: flipping through the air
            const g = SGG;

                });

            }

        // ================= HEAD SHATTER (shotgun headshot) =================

        function neckAttach(e, lx) {          // neck-stump point (world), follows the body's lean + rotation

                });

        // 1st shot: cracked skull with exposed brain patch (drawn on top of the head)
        function drawHeadCrack(hd, F, e, now) {
            const k = sm((e.hCrackT || 0) / .16), ink = e.dark ? PAPER : '#111', c0 = [-6, -9];
            const T = p => [c0[0] + (p[0] - c0[0]) * k, c0[1] + (p[1] - c0[1]) * k];
            ctx.save(); ctx.translate(hd[0], hd[1]); ctx.scale(F, 1); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(0, 0, 23.5, 0, 7); ctx.clip();

            // cracks spreading over the skull
            ctx.strokeStyle = ink; ctx.lineWidth = 1.8;
            for (const c of [[[-8, -10], [-4, -4], [-9, 2], [-6, 9]], [[-4, -4], [3, -1], [8, 5]], [[-12, -6], [-17, -2], [-16, 5]], [[3, -1], [7, -7]], [[-9, 2], [-14, 8]]]) {

            }

            const poly = [[-17, -8], [-12, -14], [-8, -12], [-4, -20], [2, -13], [7, -16], [6, -7], [0, -3], [-6, -7], [-11, -3]];
            const path = sc => { ctx.beginPath(); poly.forEach((p, i) => { const q = T([c0[0] + (p[0] - c0[0]) * sc, c0[1] + (p[1] - c0[1]) * sc]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]) }); ctx.closePath() };
            path(1.2); ctx.fillStyle = '#7a0b11'; ctx.fill();                       // bloody torn edge
            path(1); ctx.fillStyle = '#e9786c'; ctx.fill(); ctx.strokeStyle = '#5a0a10'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.save(); path(1); ctx.clip();                                         // folds (gyri)
            for (let j = 0; j < 4; j++) {
                const yy = -19 + j * 3.6;
                for (const [col, off, w] of [['#a93a34', 0, 1.6], ['#f8c2b8', -1.6, .9]]) {
                    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath();
                    for (let x = -18; x <= 8; x += 2) { const y = yy + off + Math.sin(x * .6 + j * 1.7) * 1.8; x === -18 ? ctx.moveTo(x, y) : ctx.lineTo(x, y) }

                P.gsT += dt;
                const u = Math.min(1, P.gsT / .45);
                P.gsA = P.gsFrom + (P.gsTo - P.gsFrom) * (1 - (1 - u) * (1 - u));
                if (P.gsT < 0.75) {
                    P.gsK += (1 - P.gsK) * Math.min(1, dt * 12);

                    P.gsK += (0 - P.gsK) * Math.min(1, dt * 10);
                    if (P.gun) { P.gun = 0; P.gunK = 0; P.rl = 0; }
