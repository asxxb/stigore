<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ink Walker</title>
    <style>
        :root {
            --paper: #e4e2de;
            --ink: #111;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--paper);
            overflow: hidden;
            touch-action: none
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%
        }

        #hud {
            position: fixed;
            left: 14px;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            font: 15px/1.4 Georgia, serif;
            color: #222;
            opacity: .7;
            pointer-events: none
        }

        .btns {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 18px
        }

        .btns div {
            display: flex;
            gap: 12px
        }

        .b {
            width: 68px;
            height: 68px;
            border: 3px solid #111;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            font: 28px Georgia, serif;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none
        }

        @media (pointer:coarse) {
            .btns {
                display: flex
            }
        }

        @media (max-width:420px) {
            .b {
                width: 56px;
                height: 56px;
                font-size: 24px
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="hud">A / D or ← → to walk · Shift to run · Space to jump · Shift+Space (running): parkour tumble · K: knife
        · J: stab · L: throw · M: front kick to the stomach · V: man / woman
    </div>
    <div class="btns">
        <div><span class="b" id="bl">◀</span><span class="b" id="br">▶</span></div>
        <div><span class="b" id="bp">J</span><span class="b" id="bk">K</span><span class="b" id="bj">▲</span></div>
        <span class="b" id="bd"
            style="position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 98px)">▼</span>
        <span class="b" id="bu"
            style="position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 258px)">W</span>
        <span class="b" id="bh"
            style="position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 178px)">H</span>
        <span class="b" id="bv"
            style="position:fixed; left:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 98px)">♀</span>
        <span class="b" id="bm"
            style="position:fixed; left:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 178px)">M</span>
    </div>
    <script>
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        let W, H, DPR, paper, vig;
        const BLD = 1.3;   // building size multiplier: 1 = current size, 1.3 = 30% bigger, 1.6 = much bigger
        const HOUSE_SHIFT = -5000;    // px to move the whole house area: + = right (away from the left edge), - = further left

        let vigN;
        const nightC = document.createElement('canvas'), nctx = nightC.getContext('2d');
        function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s) }
        function clamp01(v) { return Math.max(0, Math.min(1, v)); }
        function clampN(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function makePaper() {
            const p = document.createElement('canvas'); p.width = p.height = 512; const g = p.getContext('2d');
            g.fillStyle = '#e6e4e0'; g.fillRect(0, 0, 512, 512);
            const id = g.getImageData(0, 0, 512, 512), d = id.data;
            for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 26; d[i] += n; d[i + 1] += n; d[i + 2] += n }
            g.putImageData(id, 0, 0);
            g.globalAlpha = .05; g.strokeStyle = '#777';
            for (let i = 0; i < 260; i++) { g.beginPath(); const x = Math.random() * 512, y = Math.random() * 512; g.moveTo(x, y); g.lineTo(x + Math.random() * 10 - 5, y + Math.random() * 10 - 5); g.stroke() }
            paper = ctx.createPattern(p, 'repeat');
        }



        let ZOOM = 0.4;   // 1 = current size, 0.5 = same as browser zoom 50%, 0.75 = in between
        function resize() {
            DPR = Math.min(devicePixelRatio || 1, 2);
            W = innerWidth / ZOOM; H = innerHeight / ZOOM;                    // game units: bigger world on screen
            cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;       // real pixels stay the same
            ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, 0, 0);
            vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .8);
            vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(60,50,40,.28)');
            nightC.width = innerWidth * DPR; nightC.height = innerHeight * DPR; nctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, 0, 0);
            vigN = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .22, W / 2, H / 2, Math.max(W, H) * .75);
            vigN.addColorStop(0, 'rgba(0,0,0,0)'); vigN.addColorStop(1, 'rgba(4,5,12,.6)');
        }



        makePaper(); resize(); addEventListener('resize', resize);

        const keys = {};
        addEventListener('keydown', e => {
            keys[e.code] = 1;
            if (e.code === 'Space') e.preventDefault();
            if (e.repeat) return;
            if (e.code === 'KeyV') { P.female = !P.female; banner.t = .8; banner.text = P.female ? 'WOMAN' : 'MAN'; }
            if (e.code === 'KeyC') pressSmoke();
            if (e.code === 'KeyN') { const toNight = DN.d < .5; DN.t = toNight ? 0 : .5; banner.t = .8; banner.text = toNight ? 'MIDNIGHT' : 'NOON'; }
            if (e.code === 'KeyO') pressLantern();
            if (P.sm === 1 || P.ln > 0 || P.lb > 0 || P.stc > 0) return;
            if (P.sgp > 0) return;    // no actions mid-stomp
            if (e.code === 'KeyG') pressG();
            if (e.code === 'KeyH') pressHorse();
            if (e.code === 'KeyF') pressFire();
            if (e.code === 'KeyZ') pressSgDraw();
            if (e.code === 'KeyB') pressSgFire(true);
            if (e.code === 'KeyR') pressReload();
            if (e.code === 'KeyK') pressK();
            if (e.code === 'KeyL') pressThrow();
            if (e.code === 'KeyE') pressFinish();
            if (e.code === 'Space') pressJump();
            if (e.code === 'KeyJ') pressAtk();
            if (e.code === 'KeyM') pressKick();
            if (e.code === 'KeyX') pressSuperJump();
        });
        addEventListener('keyup', e => keys[e.code] = 0);
        function hold(id, k) {
            const el = document.getElementById(id);
            ['pointerdown'].forEach(t => el.addEventListener(t, e => { e.preventDefault(); keys[k] = 1 }));
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, () => keys[k] = 0));
        }
        hold('bl', 'ArrowLeft'); hold('br', 'ArrowRight'); hold('bj', 'Space'); document.getElementById('bk').addEventListener('pointerdown', e => { e.preventDefault(); pressK() });
        document.getElementById('bj').addEventListener('pointerdown', pressJump);
        hold('bd', 'ArrowDown');
        hold('bu', 'ArrowUp');
        document.getElementById('bp').addEventListener('pointerdown', e => { e.preventDefault(); pressAtk() });
        document.getElementById('bh').addEventListener('pointerdown', e => { e.preventDefault(); pressHorse() });
        document.getElementById('bv').addEventListener('pointerdown', e => { e.preventDefault(); P.female = !P.female });
        const bmBtn = document.getElementById('bm');
        if (bmBtn) {
            ['pointerdown', 'click'].forEach(evt => bmBtn.addEventListener(evt, e => {
                e.preventDefault();
                pressKick();
            }));
        }


        const P = {
            gk: 0, x: -7712 + HOUSE_SHIFT, vx: 0, z: 0, vz: 0, face: -1, phase: 0, dist: 0, atk: 0, kn: 0, kt: 0, amp: 0, lean: 0, tt: 0, rv: 0,
            jbuf: 0, coy: 0, cs: 0, ct: 0, chit: false, abuf: 0, clast: 0, cgr: 0, gt: 0, grabbed: null,
            skid: 0, skidDir: 1, skidK: 0, skA: 0, sk: null,
            idle: 0, idleAt: 3.5, fid: 0, fidType: 0, fidT: 0, fidDur: 2.4, fidK: 0,
            pk: 0, pkT: 0, pkDir: 1, pkHit: [0, 0, 0]
        };
        // knife states: kn 0 = away, 1 = forward grip, 2 = reverse grip (blade to the back)
        let CUR = P; const PL = P;   // CUR = character being drawn/animated (player or NPC)
        P.thw = 0; P.thr = 0;           // throw timer / released flag
        P.female = false;
        P.stbk = 0; P.stbHit = false;  // knife stab timer / hit flag
        P.fin = 0; P.finE = null; P.finDone = 0;
        const THR_T = .32;              // throw animation length
        const knives = [];
        const THROW_RANGE = 650;   // max distance (px) a thrown knife can fly before it drops
        const PICKUP_R = 70;       // how close you need to be to grab a knife (scaled)
        let hasKnife = true;       // you only own one knife now
        const groundKnives = [];
        const TOSS_T = .95;
        function pressK() {
            if (P.mount) { banner.t = .6; banner.text = 'DISMOUNT FIRST (H)'; return }
            if (P.thw > 0 || P.fin > 0 || P.pk > 0) return;
            if (P.gun || P.gs === 2 || P.sg) { banner.t = .6; banner.text = 'HOLSTER GUN FIRST (G)'; return }
            P.idle = 0; P.fid = 0;
            if (P.tt > 0) return;
            if (P.kn === 0) {
                if (!hasKnife) { banner.t = .6; banner.text = 'NO KNIFE!'; return }
                P.kn = 1; P.rv = 0
            }
            else if (P.kn === 1) { if (P.kt > .95) P.tt = .0001 }
            else P.kn = 0;
        }

        let last = performance.now();
        function groundY() { return H * 0.76 }

        // ---- movement feel tuning ----
        const GRAV = 1700;
        const JUMP_V = 540;
        const CUT_MULT = 6;
        const COYOTE = .1;
        const BUFFER = .1;
        const SKID_MIN = 280;
        const SKID_END = 60;
        const SKID_ACC = 1300;
        const IDLE_MIN = 3, IDLE_MAX = 6;
        function pressJump() { P.jbuf = BUFFER }

        // ---- ink skid marks + flecks + ghost afterimages (world space) ----
        const streaks = [], flecks = [], ghosts = [], impacts = [];
        function startSkid(d) {
            P.skid = 1; P.skidDir = d; P.face = d; P.skA = 0;
            const S = CSc(), mk = (off, dy, w) => { const x = P.x + d * off * S, st = { x0: x, x1: x, off, dy, w, live: true, t: 0, seed: Math.random() * 100 }; streaks.push(st); return st };
            P.sk = [mk(62, 5.5, 8), mk(14, 9.5, 5.5)];
        }
        function endSkid() { P.skid = 0; if (P.sk) for (const s of P.sk) s.live = false; P.sk = null }
        function skidFX(dt) {
            const S = CSc();
            if (P.skid) {
                for (const s of P.sk) s.x1 = P.x + P.skidDir * s.off * S;
                P.skA += dt;
                while (P.skA > .03) {
                    P.skA -= .03;
                    flecks.push({ x: P.x + P.skidDir * 62 * S, y: -2, vx: P.skidDir * (40 + Math.random() * 120), vy: -(60 + Math.random() * 180), r: 1 + Math.random() * 2, t: 0, life: .35 + Math.random() * .3 })
                }
            }
            for (let i = flecks.length - 1; i >= 0; i--) { const f = flecks[i]; f.t += dt; f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.t > f.life || f.y > 0) flecks.splice(i, 1) }
            for (let i = impacts.length - 1; i >= 0; i--) { impacts[i].t += dt; if (impacts[i].t >= impacts[i].life) impacts.splice(i, 1) }
            for (let i = streaks.length - 1; i >= 0; i--) { const s = streaks[i]; if (!s.live) { s.t += dt; if (s.t > 3.4) streaks.splice(i, 1) } }
            for (let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.t += dt; if (g.t >= g.life) ghosts.splice(i, 1) }
        }
        function addGhost(P, pose) {
            if (ghosts.length > 14) ghosts.shift();
            ghosts.push({
                x: P.x, z: P.z, dy: P.pkDeck ? (P.dh || 0) : 0, face: P.face, rot: P.rot || 0, py: (pose && pose.py !== undefined) ? pose.py : undefined,
                pose: {
                    a0: pose.a0, f0: pose.f0, a1: pose.a1, f1: pose.f1,
                    lean: pose.lean, hipX: pose.hipX, hipY: pose.hipY,
                    arch: pose.arch, hx: pose.hx, hy: pose.hy,
                    l0: [...pose.l0], l1: [...pose.l1]
                },
                t: 0, life: 0.22, alpha: 0.44
            });
        }
        function drawGhosts(gy) {
            const S = CSc();
            for (const g of ghosts) {
                const sx = g.x - P.x + W / 2;
                if (Math.abs(sx - W / 2) > W / 2 + 150) continue;
                const a = Math.max(0, (1 - g.t / g.life) * g.alpha);
                if (a <= 0.01) continue;
                const F = g.face, pose = g.pose;
                ctx.save(); ctx.translate(sx, gy + 4 - (g.dy || 0)); ctx.scale(S, S); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                const z = g.z / S, hipY = -(ANK + 120) + z + (pose.hipY || 0);
                if (g.rot) {
                    const pk = Math.min(1, -z / 60);
                    const py = (g.py !== undefined) ? g.py : (-40 * (1 - pk) + ((pose.hipY || 0) - 30) * pk);
                    ctx.translate(0, py); ctx.rotate(g.rot); ctx.translate(0, -py);
                }
                ctx.globalAlpha = a * 0.75; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
                const hipX = F * (pose.hipX || 0), l = F * pose.lean;
                const rot = (x, y) => [hipX + x * Math.cos(l) - y * Math.sin(l), hipY + x * Math.sin(l) + y * Math.cos(l)];
                const nk = rot(0, -T), cp = rot(-F * (9 + (pose.arch || 0) * 28), -T / 2);
                for (let i = 1; i >= 0; i--) {
                    const targetL = i === 0 ? pose.l0 : pose.l1, fx = hipX + F * targetL[0], fy = (P && P.pk > 0) ? targetL[1] : (targetL[1] - (targetL[2] || 0));
                    const ax = fx, ay = fy - ANK, dx = ax - hipX, dy = ay - hipY, dd = Math.hypot(dx, dy);
                    const d = Math.min(dd, 2 * L1 - 0.5), ux0 = dx / (dd || 1), uy0 = dy / (dd || 1), mx = hipX + ux0 * d / 2, my = hipY + uy0 * d / 2;
                    const h = Math.sqrt(Math.max(0, L1 * L1 - d * d / 4));
                    let nx = -uy0, ny = ux0;
                    if (dx * F < -15) { if (nx * F > 0) { nx = -nx; ny = -ny } }
                    else { if (nx * F < 0) { nx = -nx; ny = -ny } }
                    const kx = mx + nx * h, ky = my + ny * h;
                    ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.lineTo(ax, ay); ctx.stroke();
                    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 7); ctx.fill();
                }
                ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.quadraticCurveTo(cp[0], cp[1], nk[0], nk[1]); ctx.stroke();
                if (P === PL) { const hp = rot(F * 8, -14); drawHolster([hp[0], hp[1], l], F, (!P.gun && P.gs !== 2) || (P.gs === 2 && P.gsT >= 0.75)) }
                const sh = rot(0, -T + 10);
                for (let i = 0; i < 2; i++) {
                    const ang = i ? pose.a1 : pose.a0, flex = i ? pose.f1 : pose.f0, d1 = [Math.sin(ang) * F, Math.cos(ang)], el = [sh[0] + d1[0] * 58, sh[1] + d1[1] * 58];
                    const d2 = [Math.sin(ang + flex) * F, Math.cos(ang + flex)], wr = [el[0] + d2[0] * 56, el[1] + d2[1] * 56];
                    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(el[0], el[1]); ctx.lineTo(wr[0], wr[1]); ctx.stroke();
                    ctx.beginPath(); ctx.arc(wr[0], wr[1], 4.5, 0, 7); ctx.fill();
                }
                const hd = rot(-F * 7 + F * (pose.hx || 0), -T - 24 + (pose.hy || 0));
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hd[0], hd[1], 23, 0, 7); ctx.stroke();
                ctx.restore();
            }
        }
        function drawSkid(gy) {
            ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
            for (const s of streaks) {
                const a = s.live ? 1 : 1 - sm(Math.max(0, s.t - 1.2) / 2.2);
                const sx0 = s.x0 - P.x + W / 2, sx1 = s.x1 - P.x + W / 2, len = Math.abs(sx1 - sx0);
                if (len < 3 || a <= 0) continue;
                const dr = Math.sign(sx1 - sx0), y = gy + s.dy;
                for (let d = 0; d < len; d += 10) {
                    const i = d / 10, e = Math.min(len, d + 10);
                    ctx.globalAlpha = a * (.55 + .45 * hash(s.seed + i));
                    ctx.lineWidth = s.w * (.3 + .7 * Math.min(1, d / 60)) * (.8 + .4 * hash(s.seed + i * 3));
                    ctx.beginPath(); ctx.moveTo(sx0 + dr * d, y + (hash(s.seed + i * 7) - .5) * 1.6); ctx.lineTo(sx0 + dr * e, y + (hash(s.seed + i * 7 + 1) - .5) * 1.6); ctx.stroke();
                }
            }
            for (const m of impacts) {
                const k = m.t / m.life, sx = m.x - P.x + W / 2, sy = gy + 4 + m.y; ctx.globalAlpha = 1 - k * k;
                for (let i = 0; i < 12; i++) {
                    const ang = i / 12 * Math.PI * 2 + hash(i + m.seed) * .3, r0 = m.s * .15 * (1 + k), r1 = m.s * (.35 + .5 * hash(i * 2.3 + m.seed)) * (.4 + .9 * Math.min(1, k * 2));
                    ctx.lineWidth = Math.max(1, 6 * (1 - k) * (.5 + hash(i))); ctx.beginPath(); ctx.moveTo(sx + Math.cos(ang) * r0, sy + Math.sin(ang) * r0); ctx.lineTo(sx + Math.cos(ang) * r1, sy + Math.sin(ang) * r1); ctx.stroke()
                }
            }
            for (const f of flecks) { ctx.globalAlpha = Math.max(0, 1 - f.t / f.life); ctx.beginPath(); ctx.arc(f.x - P.x + W / 2, gy + 4 + f.y, f.r, 0, 7); ctx.fill() }
            ctx.restore();
        }

        // ---- idle fidgets ----
        function startFidget(q) {
            q.fid = 1; q.fidT = 0;
            const canStretch = q.kn === 0 && q.kt < .05;
            q.fidType = (canStretch && Math.random() < .5) ? 2 : 1;
            q.fidDur = q.fidType === 2 ? 2.4 : 2.8;
            q.idleAt = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
        }
        function fidgetTick(q, busy, dt) {
            if (busy) { q.idle = 0; q.fid = 0 }
            else if (q.fid) { q.fidT += dt; if (q.fidT >= q.fidDur) { q.fid = 0; q.idle = 0 } }
            else { q.idle += dt; if (q.idle >= q.idleAt) startFidget(q) }
            q.fidK += ((q.fid ? 1 : 0) - q.fidK) * Math.min(1, dt * (q.fid ? 8 : 12));
            if (!q.fid && q.fidK < .01) { q.fidK = 0; q.fidT = 0 }
        }
        function lookCurve(u) {
            const k = [[0, 0], [.18, -1], [.42, -1], [.6, .9], [.8, .9], [1, 0]];
            for (let i = 1; i < k.length; i++)if (u <= k[i][0]) { const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * sm((u - a[0]) / (b[0] - a[0])) }
            return 0;
        }
        function stretchEnv(u) { return u < .25 ? sm(u / .25) : u < .75 ? 1 : 1 - sm((u - .75) / .25) }

        function update(dt) {
            if (P.stc > 0 || P.pk > 0 || P.mount || swim.on || (typeof thClimbActive === 'function' && thClimbActive())) ldCancel();
            if (P.stc > 0) { stairTick(dt); return; }
            if (typeof thLadderUpdate === 'function' && thLadderUpdate(dt)) return;
            if (typeof updateSwim === 'function' && updateSwim()) {
                P.vz = 0; P.z = 0;
                return;
            }
            if (P.pk > 0) {
                parkourTick(dt);
                if (P.atk > 0) P.atk -= dt;
                comboTick(dt);
                stabTick(dt);
                fidgetTick(P, true, dt);
                return;
            }
            const dir = (P.fin > 0 || P.sm === 1 || P.ln > 0 || P.lb > 0 || P.fs > 0 || P.yk > 0 || P.gu > 0 || P.sgp > 0 || P.mount || P.ldLock) ? 0 : (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
            const run = keys.ShiftLeft || keys.ShiftRight;
            const max = run ? 520 : 190;
            const grounded = P.z >= 0;
            const acc = grounded ? 900 : 300;

            // ---- skid turn: reversing at a run ----
            const vs = Math.sign(P.vx);
            if (P.skid) { if (!grounded || !dir || dir === vs || Math.abs(P.vx) < SKID_END) endSkid() }
            else if (grounded && dir && vs && dir !== vs && Math.abs(P.vx) >= SKID_MIN && !P.cs) startSkid(vs);

            if (dir && !P.cs) {
                if (P.skid) P.vx += dir * SKID_ACC * dt;
                else { P.vx += dir * acc * dt; if (P.skidK < .25) P.face = dir }
            }
            else if (grounded) { const f = 1400 * dt; P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f }
            const lim = max; if (Math.abs(P.vx) > lim) P.vx += (Math.sign(P.vx) * lim - P.vx) * Math.min(1, dt * 8);
            if (!P.mount) P.x += P.vx * dt;

            // ---- treehouse: jump on the deck = the existing leap, launched from the platform ----
            if (P.jbuf > 0 && P.thDeck && P.dh > 0 && grounded && !P.pk && !P.mount && !P.cs && !P.fin && !P.stbk &&

        function ldConfig(sev, roll) {
            let c;

            else if (sev < .45) c = { tier: 1, dep: lerp(34, 62, (sev - .2) / .25), tc: .09, th: .05, tro: 0, tp: .12, tr: .20, hands: 0 };

        // ================= BARN (fixed landmark, right side of world) =================

        // ================= BACKDROP (ink sketch, parallax) =================

        // ================= EXTRA BUILDINGS & PROPS (ink sketch, same style as barn) =================

        // ================= STILT HOUSE EXTRAS =================
        const CAMP_X = -300, CAMP_SC = .9;          // campfire: left of / behind the house (local units)
        const PAD_X0 = 226, PAD_X1 = 442;           // horse paddock fence span, right of the stairs
        const HORSE_POST_X = -7720 + HOUSE_SHIFT;                  // hitching post by the paddock / house entrance
        const LEAVES = [];
        const LEAF_COL = ['rgba(110,140,80,.9)', 'rgba(170,140,70,.9)', 'rgba(150,95,60,.9)'];

        function stPoly(pts, col, lw) {
            ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
            ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = lw || .8; ctx.strokeStyle = '#111'; ctx.stroke();
        }
        function stTip(f, now) {                    // flower head position (same sway as stFlower)
            const sw = (wind.v / 400 * 3 + Math.sin(now * 1.6 + f.seed) * 1.4) * (f.h / 50);
            return [f.x + f.lean + sw, -f.h];
        }

        // ---------- leaves + petals blowing past (stateful, wind driven) ----------
        function stPartNew(any) {
            const R = Math.random, petal = R() < .55;
            return {
                x: any ? -460 + R() * 1020 : -480 - R() * 60, y: -(15 + R() * 170), vy: 0, z: .5 + R() * .5, rot: R() * 6, vr: (R() - .5) * 5,
                fl: R() * 6, ph: R() * 6, petal, col: LEAF_COL[(R() * 3) | 0]
            };
        }
        function stExtrasTick(dt) {
            clnTick(dt);
            if (!LEAVES.length) for (let i = 0; i < 30; i++) LEAVES.push(stPartNew(true));
            const s = 3.6 * BLD, t = performance.now() / 1000;
            for (const p of LEAVES) {
                const lift = Math.abs(wind.g) * .018 + 9 * Math.sin(t * 2.1 + p.ph);
                p.vy += (18 - lift * 1.5) * dt; p.vy *= Math.max(0, 1 - .9 * dt); p.y += p.vy * dt;
                p.x += (wind.v * 1.6 * (.6 + .6 * p.z) / s + Math.sin(t * 3 + p.ph) * 6) * dt;
                p.rot += (wind.v * .004 + p.vr) * dt; p.fl += (3 + Math.abs(wind.v) * .01) * dt;
                if (p.y > -2) { p.y = -2; p.vy = -(14 + Math.random() * 28) * (.5 + Math.abs(wind.v) / 300); }   // hops along the ground
                if (p.y < -230) { p.y = -230; p.vy = Math.abs(p.vy) * .3; }
                if (p.x > 520) Object.assign(p, stPartNew(false)); else if (p.x < -520) { p.x = 520; p.y = -(15 + Math.random() * 170); }
            }
        }
        function stDrawParts() {
            ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
            for (const p of LEAVES) {
                const f = Math.cos(p.fl);
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.z, p.z * (Math.abs(f) < .15 ? .15 * Math.sign(f || 1) : f));
                if (p.petal) {
                    ctx.fillStyle = 'rgba(250,246,238,.95)'; ctx.lineWidth = .5; ctx.beginPath(); ctx.ellipse(0, 0, 2.4, 1.5, 0, 0, 7); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = 'rgba(232,184,48,.8)'; ctx.beginPath(); ctx.arc(-1.4, 0, .5, 0, 7); ctx.fill();
                } else {
                    ctx.fillStyle = p.col; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(-1, -3, 4, 0); ctx.quadraticCurveTo(-1, 3, -4, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.lineWidth = .4; ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(3, 0); ctx.stroke();
                }
                ctx.restore();
            }
            ctx.restore();
        }

        // ---------- butterflies: small, detailed, shootable ----------
        const BF_N = 6, BF_SC = .28;                         // BF_SC = butterfly size (old one was ~.6)
        const bfOff = new Array(BF_N).fill(0), bfDead = []; let bfLast = 0;
        const BF_COL = [
            { a: 'rgba(238,140,40,.95)', b: 'rgba(222,112,30,.95)', sp: 'rgba(255,250,235,.95)' },   // monarch
            { a: 'rgba(120,165,225,.95)', b: 'rgba(92,132,200,.95)', sp: 'rgba(240,248,255,.9)' },   // blue
            { a: 'rgba(245,215,70,.95)', b: 'rgba(232,190,50,.95)', sp: 'rgba(120,80,20,.85)' }      // brimstone
        ];
        const BF_FORE = new Path2D('M1,-2.6 C2.5,-9 -3,-16 -10,-12.5 C-12.5,-9.5 -8,-4 -2.5,-2 Z');
        const BF_HIND = new Path2D('M.5,-1.6 C-3,-4.5 -10,-4.5 -12,-.5 C-13.5,3 -10,7 -7,5.5 C-5.5,7.5 -3,5 -2,2.5 C-1,1.5 0,.5 .5,-1.6 Z');

        function bfState(b, now) {                           // position of butterfly b (house-local space)
            const pick = (n, s) => STH_FL[Math.floor(hash(n * 3.7 + s) * STH_FL.length)];
            const seed = b * 17.3, T = 12 + (b % 3) * 2, tt = (now + seed * 1.3) / T, n = Math.floor(tt), u = tt - n;
            const A = stTip(pick(n, seed), now), B = stTip(pick(n + 1, seed), now);
            const w = now * 2.2 + seed, hov = [A[0] + Math.sin(w) * 13 + Math.sin(w * .5) * 5, A[1] - 9 + Math.sin(w * 2) * 7];
            const landA = [A[0], A[1] - 3], landB = [B[0], B[1] - 3];
            let x, y, F, rest = 0;
            if (u < .08) { const k = sm(u / .08); x = landA[0] + (hov[0] - landA[0]) * k; y = landA[1] + (hov[1] - landA[1]) * k; F = Math.cos(w) > 0 ? 1 : -1; rest = 1 - k }
            else if (u < .55) { x = hov[0]; y = hov[1]; F = Math.cos(w) > 0 ? 1 : -1 }
            else if (u < .82) { const k = sm((u - .55) / .27); x = hov[0] + (landB[0] - hov[0]) * k; y = hov[1] + (landB[1] - hov[1]) * k - Math.sin(Math.PI * k) * 14; F = B[0] >= hov[0] ? 1 : -1 }
            else { x = landB[0]; y = landB[1]; F = B[0] >= A[0] ? 1 : -1; rest = 1 }
            if (rest < .5) { x += Math.sin(now * 9 + seed) * 1.2; y += Math.sin(now * 13 + seed * 2) * 1.0 }   // erratic flutter
            return { x, y, F, rest, w, seed };
        }

        function btDraw(x, y, F, rot, fl, c, alpha) {          // one butterfly, ink style
            ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(F * BF_SC, BF_SC);
            ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
            const wx = .16 + .84 * fl;                                              // wing opening (side-on foreshortening)
            const wings = far => {
                ctx.save(); if (far) { ctx.globalAlpha *= .7; ctx.translate(1.1, -.8) }
                ctx.scale(wx, 1);
                ctx.fillStyle = c.b; ctx.fill(BF_HIND); ctx.lineWidth = 1.3; ctx.stroke(BF_HIND);
                ctx.fillStyle = c.a; ctx.fill(BF_FORE); ctx.stroke(BF_FORE);
                ctx.save(); ctx.globalAlpha *= .55; ctx.lineWidth = .45; ctx.beginPath();            // veins
                for (const [px, py] of [[-9, -12.2], [-10.3, -9.6], [-8.5, -6], [-11, -.8], [-9, 3.8], [-5.5, 4.6]]) { ctx.moveTo(0, -2.2); ctx.lineTo(px, py) }
                ctx.stroke(); ctx.restore();
                ctx.fillStyle = c.sp;                                                                // wing-edge spots
                for (const [px, py, r] of [[-8.2, -11.6, .7], [-10.2, -9.4, .6], [-10.9, -11.1, .45], [-10.6, -.4, .6], [-9, 3.7, .6]]) { ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill() }
                ctx.restore();
            };
            wings(true);
            ctx.fillStyle = '#111';                                                                // abdomen, thorax, head
            ctx.beginPath(); ctx.ellipse(-3.8, -.7, 3.4, .85, -.1, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.ellipse(.2, -1.3, 1.3, 1.1, 0, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(2, -1.5, .85, 0, 7); ctx.fill();
            ctx.lineWidth = .5; ctx.beginPath();                                                   // antennae with clubs
            ctx.moveTo(2.3, -2.1); ctx.quadraticCurveTo(3.4, -5, 4.8, -5.8); ctx.moveTo(2.6, -2); ctx.quadraticCurveTo(2.8, -4.8, 3.7, -6.5); ctx.stroke();
            ctx.beginPath(); ctx.arc(4.9, -5.9, .45, 0, 7); ctx.arc(3.8, -6.6, .45, 0, 7); ctx.fill();
            wings(false);
            ctx.restore();
        }

        function stButterflies(now) {
            const a = 1 - sm(DN.d * 2.4); if (a < .02 || !STH_FL) return;
            const dt = Math.min(.05, bfLast ? now - bfLast : 1 / 60); bfLast = now;
            ctx.save();
            for (let b = 0; b < BF_N; b++) {                                         // living butterflies
                if (now < bfOff[b]) continue;
                const s = bfState(b, now), c = BF_COL[b % 3];
                const ph = now * (s.rest > .5 ? 1.3 : 22) + s.seed, fl = s.rest > .5 ? .45 + .3 * Math.cos(ph) : Math.abs(Math.cos(ph));
                const rot = -s.F * (.3 + .15 * Math.sin(s.w)) * (1 - s.rest);
                btDraw(s.x, s.y, s.F, rot, fl, c, a * clamp01((now - bfOff[b]) / 1.5));   // fades in again after being shot
            }
            for (let i = bfDead.length - 1; i >= 0; i--) {                            // shot ones: flutter down, land, fade
                const d = bfDead[i]; d.t += dt;
                if (!d.landed) {
                    d.vy = Math.min(26, d.vy + 110 * dt); d.vx *= Math.exp(-1.5 * dt); d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
                    if (d.y >= -1) { d.y = -1; d.landed = true; d.rot = d.F * 1.4; d.t = 0 }
                } else if (d.t > 7) { bfDead.splice(i, 1); continue }
                const fl = d.landed ? .12 : Math.abs(Math.cos(now * 26 + d.seed)) * Math.max(.2, 1 - d.t * .5);
                btDraw(d.x, d.y, d.F, d.rot, fl, BF_COL[d.c], a * (d.landed ? clamp01((7 - d.t) / 1.5) : 1));
            }
            ctx.restore();
        }

        // segment (previous -> current projectile position) vs. each living butterfly, in world space
        function bflyHit(x0, y0, x1, y1, F, rad) {
            if (!STH_FL || 1 - sm(DN.d * 2.4) < .3) return false;
            const now = performance.now() / 1000, r = rad || 20, dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy || 1;
            for (let b = 0; b < BF_N; b++) {
                if (now < bfOff[b] + .8) continue;
                const s = bfState(b, now), wx = STH_WX + s.x * STH_SC, wy = s.y * STH_SC;
                let t = ((wx - x0) * dx + (wy - y0) * dy) / l2; t = Math.max(0, Math.min(1, t));
                const px = x0 + dx * t, py = y0 + dy * t;
                if ((px - wx) ** 2 + (py - wy) ** 2 < r * r) {
                    bfOff[b] = now + 14;                                                // respawns on a flower after 14 s
                    bfDead.push({ x: s.x, y: s.y, vx: F * (10 + Math.random() * 14), vy: -5, rot: 0, vr: F * (6 + Math.random() * 6), F: s.F, c: b % 3, t: 0, landed: false, seed: s.seed });
                    puffFeathers(wx, wy, 3, F); burst(wx, wy, 4, 110, F);
                    banner.t = .7; banner.text = 'BUTTERFLY!';
                    return true;
                }
            }
            return false;
        }

        // ---------- shootable clothesline ----------
        const CLN_A = [-112, -122], CLN_B = [-212, -118], CLN_T = [.14, .36, .58, .82];
        const CLN_H = [17, 20, 20, 11], CLN_HW = [9, 6, 8.5, 5];     // garment height / half width (house-local units)
        const CLN_C = [8, 9, 9, 5], CLN_R = [12, 11, 11, 9];         // hit circle: distance below the peg, radius
        const CLN = [0, 1, 2, 3].map(() => ({ hp: 2, holes: [], kick: 0, kv: 0, f: null, lastBlast: -1 }));

        function clnWk() { return Math.max(-1.2, Math.min(1.2, wind.v / 320)) }
        function clnGeom(now) {
            const wk = clnWk(), A = CLN_A, B = CLN_B;
            const C = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2 + 15 + Math.sin(now * 1.7) * 1.3 * Math.abs(wk)];
            const q = t => { const u = 1 - t; return [u * u * A[0] + 2 * u * t * C[0] + t * t * B[0], u * u * A[1] + 2 * u * t * C[1] + t * t * B[1]] };
            return { wk, C, q };
        }
        function clnAng(k, now, wk) { return -(wk * .4 + Math.sin(now * 2.4 + k * 1.7) * .05 * (.3 + Math.abs(wk))) + CLN[k].kick }

        // segment (previous -> current projectile position) vs. each hanging garment, world space
        function clothHit(x0, y0, x1, y1, F, id) {
            const now = performance.now() / 1000, g = clnGeom(now), dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy || 1;
            for (let k = 0; k < 4; k++) {
                const o = CLN[k]; if (o.f) continue;
                const p = g.q(CLN_T[k]), ang = clnAng(k, now, g.wk), d = CLN_C[k];
                const cx = STH_WX + (p[0] - d * Math.sin(ang)) * STH_SC, cy = (p[1] + d * Math.cos(ang)) * STH_SC, r = CLN_R[k] * STH_SC;
                let t = ((cx - x0) * dx + (cy - y0) * dy) / l2; t = Math.max(0, Math.min(1, t));
                const px = x0 + dx * t, py = y0 + dy * t;
                if ((px - cx) ** 2 + (py - cy) ** 2 > r * r) continue;
                const sg = id !== undefined;                       // pellets carry an id, revolver bullets don't
                if (sg) { if (o.lastBlast === id) return true; o.lastBlast = id }
                clnDamage(k, o, p, ang, px, py, F, sg);
                return true;
            }
            return false;
        }

        function clnDamage(k, o, p, ang, px, py, F, sg) {
            const lx = (px - STH_WX) / STH_SC - p[0], ly = py / STH_SC - p[1], c = Math.cos(ang), s = Math.sin(ang);
            const ux = lx * c + ly * s, uy = -lx * s + ly * c;     // hit point in garment space
            const n = sg ? 3 : 1;
            for (let i = 0; i < n && o.holes.length < 10; i++) {
                o.holes.push({
                    x: Math.max(-CLN_HW[k] + 1.5, Math.min(CLN_HW[k] - 1.5, ux + (i ? (Math.random() - .5) * 8 : 0))),
                    y: Math.max(3, Math.min(CLN_H[k] - 2, uy + (i ? (Math.random() - .5) * 8 : 0))),
                    r: (sg ? 1.8 : 1.4) + Math.random() * .9, seed: Math.random() * 99
                });
            }
            o.hp -= sg ? 2 : 1;
            o.kv -= F * (sg ? 7 : 4);                              // swings away from the shot
            burst(px, py, sg ? 8 : 4, 150, F);
            hitstop = Math.max(hitstop, .02); shake = Math.max(shake, sg ? 4 : 2);
            if (o.hp <= 0) {                                       // peg tears loose
                o.f = {
                    x: p[0], y: p[1], vx: F * (15 + Math.random() * 25), vy: -12, rot: ang,
                    vr: F * (-1 - Math.random() * 2), fl: Math.random() * 6, t: 0, lt: 0, landed: false, rot0: 0, y0: 0
                };
                banner.t = .8; banner.text = 'CLOTHES DOWN!';
            } else { banner.t = .5; banner.text = 'HOLE!' }
        }

        function clnTick(dt) {
            if (!(dt > 0)) return;
            for (let k = 0; k < 4; k++) {
                const o = CLN[k];
                o.kv += (-60 * o.kick - 3 * o.kv) * dt; o.kick += o.kv * dt;       // swing spring
                const f = o.f; if (!f) continue;
                f.t += dt;
                if (!f.landed) {
                    f.vy += (40 - f.vy * 1.6) * dt;                                  // slow, cloth-like fall
                    f.vx += (clnWk() * 60 - f.vx) * Math.min(1, dt * 1.2) + Math.sin(f.t * 5 + f.fl) * 30 * dt;
                    f.x += f.vx * dt; f.y += f.vy * dt; f.fl += dt * 6;
                    f.rot += f.vr * dt * .4 + Math.sin(f.fl) * .6 * dt;
                    if (f.y >= -CLN_H[k]) {
                        f.landed = true; f.lt = 0; f.rot0 = f.rot; f.y0 = f.y; f.dir = f.vx >= 0 ? -1 : 1;
                        burst(STH_WX + f.x * STH_SC, -2, 4, 120, Math.sign(f.vx) || 1);
                    }
                } else {
                    f.lt += dt;
                    const u = sm(f.lt / .5);
                    f.rot = f.rot0 + (f.dir * Math.PI / 2 - f.rot0) * u;             // topples flat onto the ground
                    f.y = f.y0 + (-CLN_HW[k] - f.y0) * u;
                    if (f.t > 30) { o.f = null; o.hp = 2; o.holes = []; o.kick = 0; o.kv = 0 }   // a fresh one is hung back up
                }
            }
        }

        function stGarment(k, Wv) {
            if (k === 0) stPoly([[-4, 0], [-9, 2], [-10, 10], [-7, 10.5], [-5.5, 6], [-5.5, 17 + Wv(0)], [5.5, 17 + Wv(1)], [5.5, 6], [7, 10.5], [10, 10], [9, 2], [4, 0], [0, 1.5]], 'rgba(238,232,212,.92)');
            else if (k === 1) stPoly([[-6, 0], [6, 0], [6.5, 8], [5.5, 20 + Wv(0)], [1.5, 20 + Wv(1)], [0, 9], [-1.5, 20 + Wv(2)], [-5.5, 20 + Wv(3)], [-6.5, 8]], 'rgba(110,125,150,.75)');
            else if (k === 2) stPoly([[-8, 0], [8, 0], [8.5, 20 + Wv(0)], [4, 21 + Wv(1)], [0, 20 + Wv(2)], [-4, 21 + Wv(3)], [-8.5, 20 + Wv(4)]], 'rgba(180,80,70,.7)');
            else { stPoly([[-5, 0], [-2.5, 0], [-2.5, 8], [-.5, 10 + Wv(0)], [-4, 11 + Wv(1)], [-5, 8]], 'rgba(238,232,212,.92)'); stPoly([[2.5, 0], [5, 0], [5, 8], [3.5, 11 + Wv(2)], [.5, 10 + Wv(3)], [2.5, 8]], 'rgba(238,232,212,.92)'); }
        }
        function stHoles(o) {
            ctx.save(); ctx.lineCap = 'round';
            for (const h of o.holes) {
                ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * .85, 0, 0, 7); ctx.fill();
                ctx.strokeStyle = '#111'; ctx.lineWidth = .4;                        // little tears around the hole
                for (let i = 0; i < 3; i++) { const a = hash(h.seed + i * 3) * 6.28; ctx.beginPath(); ctx.moveTo(h.x + Math.cos(a) * h.r, h.y + Math.sin(a) * h.r); ctx.lineTo(h.x + Math.cos(a) * (h.r + 1.8), h.y + Math.sin(a) * (h.r + 1.8)); ctx.stroke() }
            }
            ctx.restore();
        }

        function stClothes(now) {
            const g = clnGeom(now), wk = g.wk, A = CLN_A, B = CLN_B, C = g.C, fw = Math.abs(wk) * 1.8;
            ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
            ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(B[0], 3); ctx.lineTo(B[0] + 1, B[1] - 8); ctx.stroke();      // pole
            ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(B[0] + 1, B[1] - 6, 1.6, 0, 7); ctx.stroke();
            ctx.beginPath(); ctx.arc(A[0], A[1], 1.6, 0, 7); ctx.stroke();                                              // wall hook
            ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.quadraticCurveTo(C[0], C[1], B[0], B[1]); ctx.stroke();
            for (let k = 0; k < 4; k++) {
                const o = CLN[k]; if (o.f) continue;
                const p = g.q(CLN_T[k]), ang = clnAng(k, now, wk);
                const Wv = i => Math.sin(now * 8 + k * 2 + i * 1.3) * fw;
                ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(ang); ctx.scale(1 + .1 * Math.abs(wk), 1);
                stGarment(k, Wv); stHoles(o);
                ctx.fillStyle = 'rgb(180,140,90)'; ctx.lineWidth = .5;
                for (const px of k === 3 ? [-3.8, 3.8] : [-3, 3]) { ctx.beginPath(); ctx.rect(px - .8, -2, 1.6, 3.4); ctx.fill(); ctx.stroke() }   // pegs
                ctx.restore();
            }
            for (let k = 0; k < 4; k++) {                                                                               // garments on the ground / falling
                const o = CLN[k], f = o.f; if (!f) continue;
                const fl = f.landed ? 0 : .3, Wv = i => Math.sin(now * 8 + k * 2 + i * 1.3) * fl;
                ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
                if (!f.landed) ctx.scale(.75 + .25 * Math.cos(f.fl), 1);
                ctx.globalAlpha = f.t > 26 ? Math.max(0, (30 - f.t) / 4) : 1;
                stGarment(k, Wv); stHoles(o);
                ctx.restore();
            }
            ctx.restore();
        }

        // ---------- wind chime hanging off the end of the porch roof ----------
        function stChime(now) {
            const wk = Math.max(-1.2, Math.min(1.2, wind.v / 320)), gust = Math.min(1, Math.abs(wind.g) / 200);
            const sway = -wk * .28 + Math.sin(now * 2.1) * .05 * (.4 + Math.abs(wk)) + Math.sin(now * 5.3 + 1) * .03 * gust, act = .2 + Math.abs(wk) + gust;
            ctx.save(); ctx.translate(146, -141); ctx.rotate(sway); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
            ctx.lineWidth = .9; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 12); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(0, 12.5, 8.5, 2.2, 0, 0, 7); ctx.fillStyle = C_WOOD; ctx.fill(); ctx.lineWidth = 1; ctx.stroke();
            [20, 26, 31, 26, 20].forEach((L, i) => {
                const a = Math.sin(now * (3.2 + i * .6) + i * 1.7) * (.04 + .14 * act);

        // ================= HORSE (mount, ride, jump, trample) =================
        const HR_MOUNT_R = 170, HR_SEAT = -240, HR_WALK = 215, HR_RUN = 790, HR_JUMP = 640, HR_REAR_T = 1.0;

        function mpTick(dt) {

        // two-bone leg IK for the horse: returns [kneeX, kneeY, ankleX, ankleY]; bend +1 = knee forward, -1 = hock backward
        function hrsLegIK(ax, ay, fx, fy, bend) {
            const A1 = 62, A2 = 60, dx = fx - ax, dy = fy - ay, d = Math.hypot(dx, dy) || 1, dm = Math.min(d, A1 + A2 - .5), ux = dx / d, uy = dy / d;
            const c = Math.max(-1, Math.min(1, (A1 * A1 + dm * dm - A2 * A2) / (2 * A1 * dm)));

        }

        // ================= HORSE TURNING (head -> neck -> shoulders -> torso -> hips -> tail) =================
        // base = facing at yaw 0, q = turn progress 0..1 (towards the opposite facing), qt = target, tf = wanted facing
        Object.assign(HRS, { base: -1, tf: -1, q: 0, qt: 0, qv: 0, Y: null, brk: 0, muzS: 0 });

        function hrsFace(d) { if (!d) return; HRS.tf = d; HRS.qt = d === HRS.base ? 0 : 1; }
        function hrsTurnGo() {                               // 0..1: how much the horse may accelerate towards the new direction
            const h = HRS; if (h.q <= 0 && h.qt === 0) return 1;
            return sm(((h.qt ? h.q : 1 - h.q) - .5) / .4);
        }
        function hrsTurnLift(i) {                            // corrective steps: front legs first, hind legs last
            const h = HRS; if (h.q < .001) return 0;
            const u = (h.q - [.08, .32, .18, .42][i]) / .3;
            return (u <= 0 || u >= 1) ? 0 : Math.sin(Math.PI * u) * 15 * clamp01(h.q * 20);
        }
        function hrsTurnTick(dt, braking) {
            const h = HRS, sp = Math.abs(h.vx);
            const dur = lerp(.28, .5, clamp01(sp / HR_RUN));                 // slow = tight and quick, fast = wide and slow
            const rate = (1 / dur) * (1 - .8 * sm(sp / (HR_RUN * .6)));      // at speed the yaw barely moves until braking has slowed him
            const d = h.qt - h.q, tv = d > .0001 ? rate : d < -.0001 ? -rate : 0;

        // scale one body part about its own pivot; the pivot stays attached to the torso
        function yawIn(part, px) {
            const Y = HRS.Y, ps = Y ? Y[part] : 1, jx = px * (Y ? Y.t : 1);
            ctx.save(); ctx.translate(jx - ps * px, 0); ctx.scale(ps, 1);
        }
        function yawOut() { ctx.restore(); }

        function drawHorse(gy) {
            const h = HRS, S = CSc(), F = h.base, now = performance.now() / 1000;
            const sx = h.x - P.x + W / 2;

            if (Math.abs(sx - W / 2) > W / 2 + 260) return;

            const sp = Math.abs(h.vx);
            const rg = h.rg;
            const rr = hrsRear();
            const by = hrsBob() + h.cmp;
            const g = hrsGait(sp);
            const kk = sm(sp / 50);
            const gk = h.gk;

            const air = h.z < 0 ? clamp01(-h.z / (40 * S)) : 0;



            ctx.save();
            ctx.translate(sx, gy + 4 + h.z);
            ctx.scale(S * F * HORSE_W, S * HORSE_H);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (rr > .01) {
                ctx.translate(-52, 0);
                ctx.rotate(-.55 * rr);
                ctx.translate(52, 0);
            }

            // ============================================================
            // LEGS
            // Straighter horse legs - only a small natural knee/hock bend
            // ============================================================

            const AT = -108 + by;
            const gz = -h.z / (S * HORSE_H);                          // ground level in horse-local y (0 when standing)
            const pcs = Math.cos(-h.pitch), pns = Math.sin(-h.pitch);
            const rotP = (x, y) => { const dy = y + 122; return [x * pcs - dy * pns, x * pns + dy * pcs - 122]; };   // pitch about the body centre

            const legs = [
                { ax: 46, wo: .50, go: .10, bend: 0.18, front: 1, far: 1 },
                { ax: -52, wo: .25, go: .62, bend: -0.18, front: 0, far: 1 },
                { ax: 46, wo: 0, go: 0, bend: 0.18, front: 1, far: 0 },
                { ax: -52, wo: .75, go: .50, bend: -0.18, front: 0, far: 0 }
            ];

            const geo = legs.map((L, i) => {
                const u = ((h.ph + lerp(L.wo, L.go, rg)) % 1 + 1) % 1;
                const A = g.A * kk, st = g.st;
                let x, lift = 0;
                if (u < st) { x = A * (1 - 2 * u / st); }
                else { const s = (u - st) / (1 - st), e = s * s * (3 - 2 * s); x = -A + 2 * A * e; lift = Math.sin(Math.PI * s) * (7 + 14 * rg) * kk; }
                let fx = L.ax + x, fy = -lift;

                const bend = L.bend + Math.sign(L.bend) * fold * .82;

            });


            // ============================================================
            // LEG DRAWING
            // ============================================================



            // ============================================================
            // LEG DRAWING (tapered, with knee/hock and fetlock joints)
            // ============================================================

            // tapered limb segment with round ends
            const limb = (x0, y0, x1, y1, w0, w1) => {
                const dx = x1 - x0, dy = y1 - y0, dl = Math.hypot(dx, dy) || 1;
                const nx = -dy / dl, ny = dx / dl;
                ctx.beginPath();
                ctx.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2);
                ctx.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
                ctx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2);
                ctx.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath(); ctx.arc(x0, y0, w0 / 2, 0, 7); ctx.fill();
                ctx.beginPath(); ctx.arc(x1, y1, w1 / 2, 0, 7); ctx.fill();
            };

            const legPass = (list, col, add) => {

                ctx.fillStyle = col;

                for (const q of list) {

                    const [kx, ky, px, py] = q.k;
                    const front = q.L.front;
                    yawIn(front ? 'f' : 'h', q.L.ax);

                    // forearm / thigh: broad at the top, narrowing to the knee or hock
                    limb(q.ax2, q.at2, kx, ky, (front ? 16 : 22) + add, 9 + add);

                    // cannon bone: thin and straight

                    // knee / hock joint

                    // fetlock joint
                    ctx.beginPath(); ctx.arc(px, py, 5 + add / 2, 0, 7); ctx.fill();
                    yawOut();
                }
            };


            // ============================================================
            // HOOF
            // ============================================================

            const hoof = list => {

                ctx.fillStyle = '#111';

                for (const q of list) {
                    yawIn(q.L.front ? 'f' : 'h', q.L.ax);

                    const [kx, ky, px, py] = q.k;

                    const dx = px - kx, dy = py - ky;
                    const dl = Math.hypot(dx, dy) || 1;
                    const ux = dx / dl, uy = dy / dl;
                    const nx = -uy, ny = ux;

                    // pastern: slim, slopes slightly forward
                    const tx = px + ux * 7 + 3, ty = py + uy * 7;

                    ctx.beginPath();
                    ctx.moveTo(px + nx * 3.5, py + ny * 3.5);
                    ctx.lineTo(tx + nx * 3, ty + ny * 3);
                    ctx.lineTo(tx - nx * 3, ty - ny * 3);
                    ctx.lineTo(px - nx * 3.5, py - ny * 3.5);
                    ctx.closePath();
                    ctx.fill();

                    // hoof: small wedge, flat on the ground
                    ctx.beginPath();
                    ctx.moveTo(tx - nx * 5, ty - ny * 5);
                    ctx.lineTo(tx + nx * 5, ty + ny * 5);
                    ctx.lineTo(tx + nx * 7 + ux * 5 + 7, ty + ny * 7 + uy * 5);

                    ctx.fill();

            };


            const far = geo.filter(q => q.L.far);
            const near = geo.filter(q => !q.L.far);


            // Far legs first
            legPass(far, '#111', 6);
            legPass(far, PAPER, 0);
            hoof(far);


            ctx.save();
            if (h.pitch) { ctx.translate(0, -122); ctx.rotate(-h.pitch); ctx.translate(0, 122); }

            // ============================================================

            // ============================================================





            // ============================================================

            {

                const steps = Math.max(1, Math.min(4, Math.round(dt * 60)));

                // ---- inertia: the horse moves, the tail wants to stay behind ----

                const shY = lim((h.z - T.z) / ((S * HORSE_H) || 1));

                        const vy = (p[1] - q[1]) * 0.985;

                            -wind * 0.0022 * (0.25 + 0.75 * t) +                 // streams backward
                            Math.sin(now * 1.3 + i * 0.5) * 0.02 +               // idle breeze

                        const K = [0.30, 0.10, 0.04];
                        for (let i = 1; i <= 3; i++) {
                            const l = Math.hypot(dx, dy) || 1;

                            bY += (dy / l) * SEG;

                            P_[i][1] += (bY - P_[i][1]) * K[i - 1];

                        }
                    }

                        for (let i = 0; i < N - 1; i++) {
                            const a = P_[i], b = P_[i + 1];
                            const dx = b[0] - a[0], dy = b[1] - a[1];
                            const d = Math.hypot(dx, dy) || 0.0001;
                            const k = (d - SEG) / d;
                            if (i === 0) {
                                b[0] -= dx * k; b[1] -= dy * k;
                            } else {
                                a[0] += dx * k * 0.5; a[1] += dy * k * 0.5;
                                b[0] -= dx * k * 0.5; b[1] -= dy * k * 0.5;

        // stance -> the pose object drawChar already understands (comboPose format)
        function thAssemble(s, F) {
            const sh = [87 * Math.sin(F * s.lean), s.hy - 87 * Math.cos(F * s.lean)];         // same shoulder drawChar computes
            const arm = t => {
                if (!t || t.w < .001) return [.08, 0];                                          // normal hanging arm
                const [a, f] = ikTo(sh, t.x - s.hx, t.y, F);
                return [lerp(.08, a, t.w), lerp(0, f, t.w)];
            };
            const A0 = arm(s.h[0]), A1 = arm(s.h[1]);
            const leg = f => {                                                                  // never stretch the legs past their real length
                const dx = (f.x - s.hx) * F, lim = 150, dyMax = Math.sqrt(Math.max(0, lim * lim - dx * dx));
                let y = f.y, lift = f.lift; const dy = y - 12 - s.hy;
                if (dy > dyMax) { y = s.hy + dyMax + 12; lift = Math.max(lift, 14); }
                else if (dy < -dyMax) { y = s.hy - dyMax + 12; lift = Math.max(lift, 14); }
                return [dx, y + lift, lift];
            };
            return {
                w: 1, a0: A0[0], f0: A0[1], a1: A1[0], f1: A1[1], lean: s.lean, hipX: 0, hipY: 0, arch: .03, hx: 2, hy: 0,
                hipAbs: s.hy, l0: leg(s.f[0]), l1: leg(s.f[1]), st: STEPS[0], sw: 0, ik: 0, kneeFull: s.kf !== false
            };
        }

        // ---- controller: call every frame from update(); returns true while the ladder owns the player ----
        function thLadderUpdate(dt) {
            thLadderInit();
            const C = TH_CL, S = CSc(), n = TH_LD.n, pMax = n - 2;
            const up = !!(keys.ArrowUp || keys.KeyW), down = !!(keys.ArrowDown || keys.KeyS), left = !!(keys.ArrowLeft || keys.KeyA), right = !!(keys.ArrowRight || keys.KeyD);

            if (!C.on) {
                if (P.stc > 0 || P.mount || P.pk > 0 || P.fin > 0 || P.cs > 0 || P.thw > 0 || P.tt > 0 || P.stbk > 0 || P.fs > 0 || P.gu > 0 || P.yk > 0 || P.sgp > 0 || P.gun || P.sg || P.z < 0 || swim.on) return false;
                if (Math.abs((P.x - TH_WX) / TH_SC - TH_LD.x0) >= 40) return false;
                let top;
                if (up && !P.thDeck && !P.dh) top = false; else if (down && P.thDeck) top = true; else return false;
                Object.assign(C, { on: true, top, mode: 'walk', t: 0, mv: 0, pose: null, sp: !!keys.Space, low: 0 });
                C.F = top ? (P.face || 1) : (P.x <= TH_WX + thLadderCx(0) * TH_SC ? 1 : -1);
                P.idle = 0; P.fid = 0; P.fidK = 0; P.abuf = 0; P.jbuf = 0; P.clast = 0; P.grabbed = null;
                if (P.skid) endSkid(); P.skidK = 0;
            }
            const F = C.F;

            // ---- walk to the stand-off spot with the normal walk cycle ----
            if (C.mode === 'walk') {
                const gx = (C.top ? thXc(TH_DY * TH_SC / S) + F * TH_CLB.dk : thXc(0) - F * TH_CLB.so) * S;
                const d = gx - P.x, dir = Math.sign(d) || F, sp = 170;
                if (Math.abs(d) > sp * dt + .5) {
                    P.x += dir * sp * dt; P.vx = dir * sp; P.face = dir; P.abuf = 0; P.jbuf = 0;
                    P.phase += sp * dt / (280 * S) * Math.PI * 2;
                    P.amp += (1 - P.amp) * Math.min(1, dt * 10);
                    P.lean += (dir * .4 * (sp / 420) - P.lean) * Math.min(1, dt * 6);
                    return true;
                }
                P.x = gx; C.mode = 'in'; C.t = 0; P.dh = 0; P.thDeck = false;
            }

            P.vx = 0; P.vz = 0; P.z = 0; P.face = F; P.amp = 0; P.lean = 0; P.idle = 0; P.fid = 0; P.abuf = 0; P.jbuf = 0;
            if (!keys.Space) C.sp = false;
            let st;

            if (C.mode === 'in') {                                           // standing -> first stance
                C.t = Math.min(1, C.t + dt / .6);
                st = thEdge(C.top, F, 1 - C.t);
                if (C.t >= 1) { C.mode = 'climb'; C.phi = C.top ? pMax : TH_PMIN; C.mv = 0; }
            } else if (C.mode === 'climb') {
                if (keys.Space && !C.sp) {                                   // let go and fall / jump off
                    C.on = false; C.pose = null; C.mode = '';
                    P.thDeck = false; P.dh = 0; P.z = Math.min(0, C.low * S);
                    P.vz = -JUMP_V * .75; P.vx = ((right ? 1 : 0) - (left ? 1 : 0)) * 200; P.jbuf = 0;
                    return false;
                }
                const settled = Math.abs(C.phi - Math.round(C.phi)) < 1e-3, inp = up || down;
                let want = (up ? 1 : 0) - (down ? 1 : 0);
                if (!inp && !settled) want = C.mv;                           // finish the rung already in progress
                if (want) {
                    const prev = C.phi; C.mv = want; C.phi += want * TH_CL_RATE * dt;
                    if (!inp) {
                        if (want > 0 && Math.floor(C.phi) > Math.floor(prev)) { C.phi = Math.floor(C.phi); C.mv = 0; }
                        if (want < 0 && Math.ceil(C.phi) < Math.ceil(prev)) { C.phi = Math.ceil(C.phi); C.mv = 0; }
                    }
                }
                if (C.phi >= pMax) { C.phi = pMax; if (up) { C.mode = 'out'; C.top = true; C.t = 0; } }
                if (C.phi <= TH_PMIN) { C.phi = TH_PMIN; if (down || left || right) { C.mode = 'out'; C.top = false; C.t = 0; } }
                st = thStance(C.phi, F);
            } else {                                                         // 'out': stance -> standing (deck or ground)
                C.t = Math.min(1, C.t + dt / (C.top ? 1.1 : .7));
                st = thEdge(C.top, F, C.t);
                if (C.t >= 1) {
                    P.x = st.hx * S; C.on = false; C.pose = null; C.mode = '';
                    P.vx = 0; P.vz = 0; P.z = 0; P.face = F;
                    if (C.top) { P.thDeck = true; P.dh = -TH_DY * TH_SC; } else { P.thDeck = false; P.dh = 0; }
                    return false;
                }
            }

            P.x = st.hx * S;
            C.low = Math.max(st.f[0].y, st.f[1].y);
            C.pose = thAssemble(st, F);
            for (const f of st.f) thLadderLoad(thLocY(f.y), .5);              // feet and hands load the rungs
            for (const hd of st.h) if (hd) thLadderLoad(thLocY(hd.y), .2 * hd.w);
            return true;
        }

        // ---------- reactive fish ----------

        function initFish() {

                dir: i % 2 ? -1 : 1, face: i % 2 ? -1 : 1, s: .9 + hash(i * 2.2) * .5, ph: i * 1.7,

        // Called from splash(): big splashes scare nearby fish.
        function scareFish(wx, power) {
            if (power < 1.5) return;                       // small rain drops are ignored

            for (const f of fish) {

                if (d < R) { f.fear = Math.max(f.fear, 1 - d / R * .5); f.fx = px; }

        function updateFish(now) {
            if (!fish.length) initFish();
            const dt = Math.min(.05, fLast ? now - fLast : 1 / 60); fLast = now;
            const px = P.x - POND_X, py = swim.on ? swim.y : 24;
            const pspd = fPX === null ? 0 : Math.abs(P.x - fPX) / Math.max(dt, .001); fPX = P.x;
            stillT = (pspd < 8 && Math.abs(swim.vy) < 15) ? stillT + dt : 0;

            for (const f of fish) {
                if (f.dead) {
                    f.deadT += dt; f.vx *= Math.exp(-2 * dt);
                    f.x = clampN(f.x + f.vx * dt, -POND_RX + 30, POND_RX - 30);
                    f.y += (7 - f.y) * Math.min(1, dt * 1.2);               // floats up
                    if (f.deadT > 25) { f.dead = 0; f.fear = 0; f.y = 60; f.vx = 0; }
                    continue;
                }
                f.fear = Math.max(0, f.fear - dt * .45);
                if (f.fear < .05) f.fx = null;

                const c = clampN(Math.round((f.x + POND_RX) / WSP), 1, WN - 1);
                const dist = Math.abs(wv[c]) + Math.abs(wh[c]) * .15;
                f.fear = Math.min(1, f.fear + dist * Math.max(0, 1 - f.y / (POND_RY * .7)) * dt * 1.2);

                if (f.fear > .2 && f.fx === null) f.fx = f.x - f.dir * 50;     // no known source: bolt forward

        function projMove(p, dt) {

        // returns true when the projectile is finished

            if (!p.m) {                                                // ---- in the air: watch for the surface ----
                if (!inPond(p.x)) return false;
                const sy = waterSurfaceY(p.x);
                if (p.y < sy) return false;
                const v = p[key];
                if (py < sy) {                                         // crossed the surface this frame

            } else fowlRespT = 12;
        }

        function drawFowl(gy) {
            const S = CSc(), now = performance.now() / 1000, INK = '#111';
            for (const f of fowl) {
                const sx = f.x - P.x + W / 2; if (sx < -160 || sx > W + 160) continue;
                const sc = S * f.s, sw = f.swan, dead = f.st >= 5, flap = f.st >= 1 && f.st <= 3, air = f.st === 2 || f.st === 3;
                const wl = gy + 4 + waterSurfaceY(f.x);
                const phi = dead ? 1.8 : f.st === 4 ? .5 + .4 * Math.sin(f.ph) : .8 + 1.2 * Math.sin(f.ph);
                const BODY = sw ? PAPER : 'rgba(150,125,95,.9)';

                ctx.save();
                if (f.wet) { ctx.beginPath(); ctx.rect(sx - 200, gy - 1200, 400, wl - (gy - 1200)); ctx.clip() }   // lower body is under water
                ctx.translate(sx, gy + 4 + f.y); ctx.scale(sc * f.F, sc); ctx.rotate(f.rot);
                ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 2;

                const wing = (p, far) => {
                    ctx.save(); ctx.translate(2, -4); ctx.rotate(p);
                    const k = (sw ? 1.7 : 1.3) * (far ? .85 : 1); ctx.scale(k, k);
                    ctx.globalAlpha = far ? .75 : 1; ctx.fillStyle = BODY;
                    ctx.beginPath(); ctx.moveTo(5, 0); ctx.quadraticCurveTo(2, -20, -16, -32); ctx.quadraticCurveTo(-8, -16, -12, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.globalAlpha = (far ? .75 : 1) * .5; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-10, -24); ctx.moveTo(-3, -4); ctx.lineTo(-12, -14); ctx.stroke();
                    ctx.restore();
                };
                const showW = flap || f.st === 4 || dead;
                if (showW) wing(phi + .5, true);

                if (f.st === 3 || f.st === 4) {                          // feet reaching for the water
                    ctx.strokeStyle = 'rgba(225,135,40,1)'; ctx.lineWidth = 2.2;
                    ctx.beginPath(); ctx.moveTo(1, 6); ctx.lineTo(9, 12); ctx.moveTo(-3, 6); ctx.lineTo(5, 12); ctx.stroke();
                    ctx.strokeStyle = INK; ctx.lineWidth = 2;
                } else if (air) {                                        // feet tucked back
                    ctx.strokeStyle = 'rgba(225,135,40,1)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-8, 5); ctx.lineTo(-18, 7); ctx.stroke(); ctx.strokeStyle = INK;
                }

                ctx.fillStyle = BODY;                                    // tail
                ctx.beginPath(); ctx.moveTo(-13, -3); ctx.lineTo(sw ? -23 : -25, sw ? -4 : -7); ctx.lineTo(-24, 2); ctx.lineTo(-12, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = PAPER;                                   // body
                ctx.beginPath(); ctx.ellipse(0, 0, sw ? 17 : 15, sw ? 9.5 : 8, 0, 0, 7); ctx.fill(); ctx.stroke();
                if (!sw) { ctx.fillStyle = 'rgba(150,100,70,.5)'; ctx.beginPath(); ctx.ellipse(7, -1.5, 6.5, 5.5, 0, 0, 7); ctx.fill() }   // brown chest

                if (!showW) {                                            // folded wing
                    ctx.fillStyle = sw ? '#ebe8e1' : 'rgba(150,125,95,.9)'; ctx.lineWidth = 1.8;
                    ctx.beginPath(); ctx.moveTo(8, -3); ctx.quadraticCurveTo(-2, -11, sw ? -18 : -15, sw ? -6 : -3); ctx.quadraticCurveTo(-6, 3, 8, -3); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.globalAlpha = .5; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(3, -4); ctx.lineTo(-10, -4); ctx.stroke(); ctx.globalAlpha = 1; ctx.lineWidth = 2;
                }

                // ---- neck + head ----
                let hx, hy;

                    ctx.beginPath();
                    if (air) { ctx.moveTo(11, -3); ctx.lineTo(34, -5); hx = 37; hy = -5.5 }
                    else { const w = Math.sin(now * 1.3 + f.seed) * 1.5; ctx.moveTo(10, -4); ctx.bezierCurveTo(25, -4, 2 + w, -22, 14 + w, -36); hx = 16 + w; hy = -37 }
                    if (dead) { ctx.beginPath(); ctx.moveTo(10, -4); ctx.quadraticCurveTo(24, 6, 30, 2); hx = 33; hy = 2.5 }
                    ctx.strokeStyle = INK; ctx.lineWidth = 7.5; ctx.stroke(); ctx.strokeStyle = PAPER; ctx.lineWidth = 4.5; ctx.stroke();
                    ctx.strokeStyle = INK; ctx.lineWidth = 2;
                    ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(hx, hy, 4, 0, 7); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = 'rgba(225,135,40,.95)'; ctx.beginPath(); ctx.moveTo(hx + 3, hy - 2); ctx.lineTo(hx + 12, hy + (air ? 0 : 1.5)); ctx.lineTo(hx + 3, hy + 2.5); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(hx + 3.5, hy - 2.2, 1.1, 0, 7); ctx.fill();   // beak knob
                } else {

                    if (dead) { hx = 20; hy = 3 }
                    ctx.beginPath(); ctx.moveTo(9, -2); ctx.lineTo(hx - 1, hy + 1);
                    ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.stroke(); ctx.strokeStyle = 'rgba(60,110,75,1)'; ctx.lineWidth = 5; ctx.stroke();
                    ctx.strokeStyle = PAPER; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(hx - 6, hy + 6); ctx.lineTo(hx - 3.5, hy + 3.2); ctx.stroke();   // white neck ring
                    ctx.strokeStyle = INK; ctx.lineWidth = 2;
                    ctx.fillStyle = 'rgba(60,110,75,1)'; ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, 7); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = 'rgba(230,190,60,.95)'; ctx.beginPath(); ctx.moveTo(hx + 4, hy - 1.5); ctx.lineTo(hx + 12, hy + .8); ctx.lineTo(hx + 4, hy + 3); ctx.closePath(); ctx.fill(); ctx.stroke();
                }
                const ex = hx + 1.5, ey = hy - 1.5;                      // eye
                if (dead) { ctx.strokeStyle = sw ? INK : PAPER; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(ex - 1.5, ey - 1.5); ctx.lineTo(ex + 1.5, ey + 1.5); ctx.moveTo(ex + 1.5, ey - 1.5); ctx.lineTo(ex - 1.5, ey + 1.5); ctx.stroke() }
                else { ctx.fillStyle = sw ? INK : PAPER; ctx.beginPath(); ctx.arc(ex, ey, 1.1, 0, 7); ctx.fill() }

                if (f.wet && !dead) {                                    // ripples + wake on the waterline
                    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
                    ctx.globalAlpha = .45;
                    ctx.beginPath(); ctx.ellipse(sx, wl + 1, (20 + 4 * Math.sin(now * 2 + f.seed)) * sc, 2.5, 0, 0, 7); ctx.stroke();
                    const mv = Math.min(1, Math.abs(f.vx) / 40);

                        ctx.globalAlpha = .5 * mv;

                            ctx.beginPath(); ctx.moveTo(sx - f.F * 14 * sc, wl + 1 + k * 3);

                        }
