            }
        }

        // ================= BIRD GORE: organs, mini veins, blood drops, grass stains =================
        const bg = { drops: [], organs: [], veins: [], stains: [] };
        const BG_GRAV = 1400;

        function bgDrop(x, y, vx, vy, r) {
            if (bg.drops.length < 500) bg.drops.push({ x, y, vx, vy, r, t: 0 });
        }
        function bgStain(x, w, big) {
            // merge small drops into a nearby puddle instead of making endless stains
            if (!big) {
                for (let i = bg.stains.length - 1; i >= Math.max(0, bg.stains.length - 30); i--) {
                    const s = bg.stains[i];
                    if (s.big && Math.abs(s.x - x) < s.gw * .9 && s.t < 20) { s.gw = Math.min(s.gw + w * .15, 60); return s; }
                }
            }
            if (bg.stains.length > 260) bg.stains.shift();
            const S = CSc();
            const st = { x, w: w * .45, gw: w, h: Math.max(1.2, w * (.2 + Math.random() * .1)), t: 0, big: !!big, blades: [] };
            const nb = big ? 3 + (Math.random() * 3 | 0) : (Math.random() < .5 ? 1 + (Math.random() * 2 | 0) : 0);
            for (let i = 0; i < nb; i++) st.blades.push({ dx: (Math.random() - .5) * Math.max(10, w) * 1.5, h: (8 + Math.random() * 10) * S, ph: Math.random() * 6, tip: Math.random() < .55 });
            bg.stains.push(st);
            return st;
        }

        function birdGore(x, y, F, sz) {
            const S = CSc() * sz, R = Math.random;
            const kinds = ['heart', 'lung', 'lung', 'liver', 'gizzard', 'kidney', 'kidney', 'bit', 'bit', 'bit', 'bit'];
            const size = { heart: 3.4, lung: 3.8, liver: 4.2, gizzard: 3.6, kidney: 2.4, bit: 1.6 };
            for (const k of kinds) {
                if (bg.organs.length > 90) break;
                bg.organs.push({
                    k, x: x + (R() - .5) * 8 * S, y: y + (R() - .5) * 6 * S,
                    vx: F * (30 + R() * 300) + (R() - .5) * 240, vy: -(120 + R() * 340),
                    rot: R() * 6, vr: (R() - .5) * 18, r: size[k] * S, landed: false, bn: 0, t: 0, bl: 0, sq: 0, seed: R() * 100
                });
            }
            const mkVein = (w, col, N, rest, spd, gut) => {
                const vx = F * (40 + R() * spd) + (R() - .5) * spd * .5, vy = -(80 + R() * spd * .9);
                const p = Array.from({ length: N }, (_, i) => {
                    const px = x - F * i * rest * .3;
                    return { x: px, y: y, ox: px - vx / 60 * (1 - i / N * .3), oy: y - vy / 60 * (1 - i / N * .3) };
                });
                bg.veins.push({ p, rest, w, col, gut, t: 0, bl: 0 });
            };
            const cols = ['#a3121a', '#8c0d14', '#6b2a5a'];
            for (let i = 0; i < 6; i++) mkVein((1.1 + R() * .8) * S, cols[i % 3], 4 + (R() * 3 | 0), (3 + R() * 2) * S, 300);
            for (let i = 0; i < 2; i++) mkVein(3.4 * S, '#e9786c', 9, 3.6 * S, 260, true);

            // blood: fine mist + heavy drops, sprayed in a cone with some going backwards
            for (let i = 0; i < 46; i++) {
                const sp = 80 + R() * 520, a = R() * Math.PI * 2, fwd = R() < .65;
                bgDrop(x + (R() - .5) * 8, y + (R() - .5) * 8,
                    (fwd ? F : -F) * sp * (.3 + R() * .7) + Math.cos(a) * 40, -sp * (.1 + R() * .7) + Math.sin(a) * 40,
                    (R() < .2 ? 2.2 : 1) + R() * 1.6);
            }
            for (let i = 0; i < 30; i++) bgDrop(x, y, (R() - .5) * 340, -(R() * 260), .7 + R() * .6);   // mist
        }

        function bgTick(dt) {
            const S0 = CSc(), R = Math.random;
            // ---- blood drops ----
            for (let i = bg.drops.length - 1; i >= 0; i--) {
                const d = bg.drops[i]; d.t += dt;
                d.vy += BG_GRAV * dt; d.vx *= Math.exp(-.8 * dt); d.x += d.vx * dt; d.y += d.vy * dt;
                const wet = inPond(d.x, -6);
                if (d.y >= (wet ? waterSurfaceY(d.x) : 0)) {
                    if (wet) {                                           // into the pond: ripple + red cloud
                        if (d.r > 1.4) splash(d.x, .4, 0);
                        if (wClouds.length < 90 && R() < .35) wClouds.push({ x: d.x, y: 3, r: 3, g: 7, t: 0, life: 1.3, k: 0 });
                        bg.drops.splice(i, 1); continue;
                    }
                    if (d.r > 1.6 && d.vy > 300 && R() < .5) {           // big drops bounce into tiny droplets
                        for (let k = 0; k < 2; k++) bgDrop(d.x, -2, (R() - .5) * 120, -(50 + R() * 90), .7 + R() * .5);
                    }
                    if (d.r > 1.3 || R() < .45) bgStain(d.x, d.r * (2.2 + R() * 3), false);
                    bg.drops.splice(i, 1); continue;
                }
                if (d.t > 4) bg.drops.splice(i, 1);
            }
            // ---- stains: puddles spread, then dry; wet grass blades drip ----
            for (let i = bg.stains.length - 1; i >= 0; i--) {
                const s = bg.stains[i]; s.t += dt;
                s.w += (s.gw - s.w) * Math.min(1, dt * (s.big ? 1.2 : 4));
                s.h = Math.max(s.h, s.w * .2);
                if (s.t < 20) for (const bl of s.blades) if (bl.tip && R() < dt * .12) {
                    bl.tip = false; bgDrop(s.x + bl.dx, 4 - bl.h, 0, 0, 1.2);   // a slow drip off the grass tip
                }
                if (s.t > 45) bg.stains.splice(i, 1);
            }
            // ---- organs ----
            for (let i = bg.organs.length - 1; i >= 0; i--) {
                const o = bg.organs[i];
                o.sq = Math.max(0, o.sq - dt * 5);
                if (waterBit(o, dt, bg.organs, i, 40, 85, .1)) continue;
                if (!o.landed) {
                    o.t += dt; o.vy += BG_GRAV * dt; o.vx *= Math.exp(-.6 * dt);
                    o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
                    o.bl -= dt;
                    if (o.bl <= 0 && o.t < 1.8) { o.bl = .035; bgDrop(o.x, o.y, o.vx * .05 + (R() - .5) * 30, 10 + R() * 30, 1 + R() * 1.4) }   // bleeds in flight
                    if (o.y >= -o.r * .5) {
                        o.y = -o.r * .5;
                        if (Math.abs(o.vy) > 200 && o.bn < 2) {          // wet bounce, squashes and sprays
                            o.vy *= -.3; o.vx *= .55; o.vr *= .5; o.bn++; o.sq = 1;
                            for (let k = 0; k < 4; k++) bgDrop(o.x, -2, (R() - .5) * 160, -(60 + R() * 120), 1 + R());
                            bgStain(o.x, o.r * (2 + R() * 2), false);
                        } else {
                            o.landed = true; o.t = 0; o.vx = 0; o.vr = 0; o.sq = .6;
                            bgStain(o.x, o.r * (4 + R() * 3), true);      // pool under the organ
                            for (let k = 0; k < 3; k++) bgDrop(o.x, -2, (R() - .5) * 90, -(30 + R() * 60), 1 + R() * .8);
                        }
                    }
                } else { o.t += dt; if (o.t > 40) bg.organs.splice(i, 1) }
            }
            // ---- mini veins + intestines (verlet ropes) ----
            const floor = -1.5 * S0, sub = 2, h = dt / sub;
            for (let i = bg.veins.length - 1; i >= 0; i--) {
                const v = bg.veins[i], Q = v.p, N = Q.length; v.t += dt;
                if (dt > 0) for (let s = 0; s < sub; s++) {
                    for (let j = 0; j < N; j++) {
                        const p = Q[j], vx = (p.x - p.ox) * .985, vy = (p.y - p.oy) * .985;
                        p.ox = p.x; p.oy = p.y; p.x += vx; p.y += vy + 1800 * h * h;
                    }
                    for (let it = 0; it < 5; it++) {
                        for (let j = 0; j < N - 1; j++) {
                            const a = Q[j], b = Q[j + 1], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .0001, k = (d - v.rest) / d * .5;
                            a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k;
                        }
                        for (let j = 0; j < N; j++) { const p = Q[j]; if (p.y > floor) { p.y = floor; p.ox += (p.x - p.ox) * .55 } }
                    }
                }
                if (v.t < 3) {                                           // dripping while it flops
                    v.bl -= dt;
                    if (v.bl <= 0) { v.bl = .06; const t = Q[N - 1]; bgDrop(t.x, t.y, (R() - .5) * 20, R() * 20, 1 + R()) }
                }
                if (v.t > 26) bg.veins.splice(i, 1);
            }
        }

        function drawBGoreGround(gy) {
            if (!bg.stains.length) return;
            const now = performance.now() / 1000;
            ctx.save(); ctx.lineCap = 'round';
            for (const s of bg.stains) {
                const sx = s.x - P.x + W / 2; if (sx < -90 || sx > W + 90) continue;
                const fade = s.t > 36 ? 1 - (s.t - 36) / 9 : 1; if (fade <= 0) continue;
                const dry = Math.min(1, s.t / 25);
                const col = 'rgb(' + Math.round(179 - 90 * dry) + ',' + Math.round(20 - 10 * dry) + ',' + Math.round(28 - 14 * dry) + ')';
                ctx.globalAlpha = .92 * fade; ctx.fillStyle = col;
                ctx.beginPath(); ctx.ellipse(sx, gy + 5, s.w, s.h, 0, 0, 7); ctx.fill();
                if (dry < .8) {                                          // wet sheen fades as it dries
                    ctx.globalAlpha = .5 * (1 - dry) * fade; ctx.fillStyle = '#ffaaa0';
                    ctx.beginPath(); ctx.ellipse(sx - s.w * .25, gy + 5 - s.h * .25, s.w * .3, s.h * .25, 0, 0, 7); ctx.fill();
                }
                for (const bl of s.blades) {                             // blood-soaked grass blades
                    const sw = (wind.v / 300) * 5 + Math.sin(now * 2.4 + bl.ph) * 2, bx = sx + bl.dx, by = gy + 8;
                    ctx.globalAlpha = .9 * fade; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.7;
                    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + sw * .3, by - bl.h * .55, bx + sw, by - bl.h); ctx.stroke();
                    ctx.strokeStyle = col; ctx.lineWidth = 1.1;
                    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + sw * .15, by - bl.h * .3, bx + sw * .45, by - bl.h * .62); ctx.stroke();
                    if (bl.tip && s.t < 20) {                            // swelling drop on the tip
                        ctx.fillStyle = '#b3141c'; ctx.globalAlpha = .95 * fade;
                        ctx.beginPath(); ctx.arc(bx + sw, by - bl.h + 1, 1.5 + .5 * Math.sin(now * 3 + bl.ph), 0, 7); ctx.fill();
                    }
                }
            }
            ctx.restore();
        }

        function bgOrgan(k, r, seed) {                                   // drawn around (0,0)
            ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.2; ctx.strokeStyle = '#3a0508';
            if (k === 'heart') {
                ctx.fillStyle = '#a8141c'; ctx.beginPath(); ctx.moveTo(0, r * 1.1);
                ctx.bezierCurveTo(-r * 1.5, r * .1, -r * 1.1, -r * 1.1, 0, -r * .4);
                ctx.bezierCurveTo(r * 1.1, -r * 1.1, r * 1.5, r * .1, 0, r * 1.1); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#e0605a'; ctx.beginPath(); ctx.ellipse(-r * .4, -r * .1, r * .3, r * .2, -.5, 0, 7); ctx.fill();
                ctx.strokeStyle = '#8c0d14'; ctx.lineWidth = 1.6;
                ctx.beginPath(); ctx.moveTo(-r * .3, -r * .5); ctx.lineTo(-r * .5, -r * 1.3); ctx.moveTo(r * .3, -r * .5); ctx.lineTo(r * .5, -r * 1.2); ctx.stroke();
            } else if (k === 'lung') {
                ctx.fillStyle = '#e98c92'; ctx.beginPath(); ctx.ellipse(0, 0, r * 1.25, r * .8, 0, 0, 7); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = '#a84a52'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(-r * .9, 0); ctx.lineTo(r * .6, -r * .1); ctx.moveTo(-r * .2, 0); ctx.lineTo(r * .2, -r * .5); ctx.moveTo(-r * .2, 0); ctx.lineTo(r * .1, r * .5); ctx.stroke();
                ctx.fillStyle = '#f8c2b8'; ctx.beginPath(); ctx.ellipse(r * .3, -r * .35, r * .35, r * .15, 0, 0, 7); ctx.fill();
            } else if (k === 'liver') {
                ctx.fillStyle = '#6e1a22'; ctx.beginPath(); ctx.moveTo(-r * 1.3, 0);
                ctx.quadraticCurveTo(-r * .6, -r * 1.1, r * .8, -r * .7); ctx.quadraticCurveTo(r * 1.5, -r * .2, r * 1.1, r * .5);
                ctx.quadraticCurveTo(r * .1, r * 1, -r * 1.3, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = '#3a0a10'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(r * .3, -r * .6); ctx.lineTo(r * .1, r * .1); ctx.stroke();
                ctx.fillStyle = '#a04050'; ctx.beginPath(); ctx.ellipse(-r * .4, -r * .25, r * .4, r * .15, -.3, 0, 7); ctx.fill();
            } else if (k === 'gizzard') {
                ctx.fillStyle = '#8a4a4a'; ctx.beginPath(); ctx.ellipse(0, 0, r, r * .85, 0, 0, 7); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = '#5a2a2a'; ctx.lineWidth = 1;
                for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * r * .4, -r * .7); ctx.quadraticCurveTo(i * r * .6, 0, i * r * .4, r * .7); ctx.stroke() }
            } else if (k === 'kidney') {
                ctx.fillStyle = '#7a2230'; ctx.beginPath(); ctx.moveTo(-r, 0);
                ctx.bezierCurveTo(-r, -r * 1.1, r, -r * 1.1, r, 0); ctx.bezierCurveTo(r, r * .6, r * .2, r * .5, 0, r * .1);
                ctx.bezierCurveTo(-r * .2, r * .5, -r, r * .6, -r, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
            } else {
                ctx.fillStyle = '#c9505a'; ctx.beginPath();
                for (let j = 0; j < 6; j++) { const a = j / 6 * Math.PI * 2, rr = r * (.7 + .5 * hash(seed + j * 3)); const px = Math.cos(a) * rr * 1.2, py = Math.sin(a) * rr * .8; j ? ctx.lineTo(px, py) : ctx.moveTo(px, py) }
                ctx.closePath(); ctx.fill(); ctx.stroke();
            }
        }

        function drawBGoreAir(gy) {
            if (!bg.veins.length && !bg.organs.length && !bg.drops.length) return;
            ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';

                    a.bt = .09 + R() * .08;
                    const y = a.y - (a.mode === 'W' && !a.hop ? 5 : 15) * S * a.s;
                    if (a.mode === 'W' && !a.hop) wClouds.push({ x: a.x, y: 4, r: 2.5, g: 6, t: 0, life: 1.2, k: 0 });
                    else bgDrop(a.x + (R() - .5) * 8, y, (R() - .5) * 30, 10 + R() * 30, 1.2 + R() * 1.4);
                }
            }
        }

        // ---------- drawing ----------
        // local space: +x = forward, y = 0 is the feet on land / the waterline in water
        function dkShape(a, now, wet, under) {
            const Y = a.young, INK = '#111', k = clamp01(DN.d * (1 - a.lit) * .85);   // k = how far it sinks into silhouette at night
            const WH = dkMix([249, 247, 240], [34, 36, 44], k), WH2 = dkMix([234, 231, 220], [28, 30, 38], k);
            const BK = dkMix([240, 176, 52], [70, 52, 28], k), LG = dkMix([228, 138, 44], [62, 42, 24], k);
            const bx = Y ? 10.5 : 14, br = Y ? 7.6 : 9.2, hr = Y ? 5.6 : 5.2, LEG = Y ? 4 : 5.5, lw = Y ? 1.5 : 1.7;
            const air = !!a.hop, spd = Math.abs(a.vx), walking = !wet && !air && spd > 4;
            const bob = walking ? Math.abs(Math.sin(a.ph)) * (Y ? 2.4 : 1.4) : (wet ? Math.sin(now * 1.9 + a.seed) * .6 : Math.sin(now * 1.6 + a.seed) * .25);
            const cy = (wet ? -br * .5 : -(br + LEG)) - bob;               // body centre
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';

            if (!wet && !air && !under) {                                  // soft ground shadow
                ctx.save(); ctx.globalAlpha *= .22; ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, 1, bx * .85, 1.8, 0, 0, 7); ctx.fill(); ctx.restore();
            }
            const leg = (hx, hy, fx, fy) => {
                ctx.strokeStyle = INK; ctx.lineWidth = Y ? 3.2 : 3.8; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(fx, fy); ctx.stroke();
                ctx.strokeStyle = LG; ctx.lineWidth = Y ? 1.5 : 2; ctx.stroke();
                const L = Y ? 4.5 : 6;
                ctx.beginPath(); ctx.moveTo(fx - 1.5, fy - 1.4); ctx.lineTo(fx + L, fy + .2); ctx.lineTo(fx - 1.5, fy + 1); ctx.closePath();
                ctx.fillStyle = LG; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = .9; ctx.stroke();
            };
            for (let i = 0; i < 2; i++) {
                const p = a.ph + i * Math.PI, hx = i ? -3 : 3;
                if (wet) { if (under) leg(hx, cy + br * .7, hx - 2 + Math.sin(p) * 4, cy + br + 3 + Math.max(0, Math.cos(p)) * 1.6) }   // paddling feet, seen under the water
                else if (air) leg(hx, cy + br * .7, hx + (i ? -5 : 4), -LEG * .35);
                else {
                    const st = walking ? Math.sin(p) : 0, lift = walking ? Math.max(0, Math.cos(p)) * (Y ? 2.6 : 3.2) : 0;
                    leg(hx, cy + br * .7, hx + st * (Y ? 3.6 : 4.6), -lift);
                }
            }

            ctx.save(); ctx.translate(0, cy); ctx.rotate(a.tilt + a.dip * .55); ctx.translate(0, -cy);   // whole upper body (tips forward when dipping)

            ctx.save(); ctx.translate(-bx + 2.5, cy - br * .15); ctx.rotate(a.tail + .12);               // tail
            ctx.beginPath(); ctx.moveTo(2, -2.8); ctx.quadraticCurveTo(-4, -6.5, -(Y ? 6.5 : 9.5), -(Y ? 5.5 : 8.5)); ctx.quadraticCurveTo(-4.5, -.5, 2, 3.2); ctx.closePath();
            ctx.fillStyle = WH; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();

            ctx.beginPath(); ctx.ellipse(0, cy, bx, br, 0, 0, 7);                                        // body
            ctx.fillStyle = WH; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();

            ctx.save(); ctx.translate(bx * .12, cy - br * .12); ctx.rotate(a.wing * .5 + (air ? .55 : 0)); const w = Y ? .78 : 1;   // folded wing
            ctx.beginPath(); ctx.moveTo(7 * w, -1.5 * w); ctx.quadraticCurveTo(1 * w, -8 * w, -11 * w, -3 * w); ctx.quadraticCurveTo(-3 * w, 3.5 * w, 7 * w, -1.5 * w); ctx.closePath();
            ctx.fillStyle = WH2; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw * .8; ctx.stroke();
            ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(-1 * w, -2 * w); ctx.lineTo(-7 * w, -3 * w); ctx.stroke(); ctx.restore();

            // neck + head
            const hdS = Math.abs(a.hd) < .2 ? .2 * (Math.sign(a.hd) || 1) : a.hd;
            const sx0 = bx * .5, sy0 = cy - br * .6;
            let hx = bx * (Y ? .74 : .82) + (walking ? Math.sin(a.ph * 2) * (Y ? 1.1 : 1.6) : Math.sin(now * 1.3 + a.seed) * .9);
            let hy = cy - (Y ? br + hr * .55 : br + 4.4) + (walking ? Math.cos(a.ph * 2) * .6 : Math.sin(now * 1.7 + a.seed * 2) * .5);
            hx = lerp(hx, bx * 1.08, a.dip); hy = lerp(hy, cy + br + 3.6, a.dip);
            ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.quadraticCurveTo(lerp(sx0, hx, .35) + (Y ? 0 : 2.2), lerp(sy0, hy, .6), hx, hy);
            ctx.strokeStyle = INK; ctx.lineWidth = Y ? 6.2 : 7.2; ctx.stroke(); ctx.strokeStyle = WH; ctx.lineWidth = Y ? 4.2 : 5.2; ctx.stroke();

            ctx.save(); ctx.translate(hx, hy); ctx.scale(hdS, 1); ctx.rotate(a.dip * 1.2 + Math.sin(now * 1.1 + a.seed) * .05);
            ctx.beginPath(); ctx.arc(0, 0, hr, 0, 7); ctx.fillStyle = WH; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
            if (Y) {                                                                                     // faint yellow fluff on the duckling's head
                ctx.save(); ctx.beginPath(); ctx.arc(0, 0, hr - .6, 0, 7); ctx.clip();
                ctx.globalAlpha *= .4; ctx.fillStyle = dkMix([252, 232, 150], [60, 54, 36], k); ctx.beginPath(); ctx.arc(-hr * .2, -hr * .5, hr * .85, 0, 7); ctx.fill(); ctx.restore();
            }
            const bl = Y ? 4.2 : 7.2, bt = Y ? 2.2 : 3.2;                                                // beak
            ctx.beginPath(); ctx.moveTo(hr * .7, -bt * .55); ctx.quadraticCurveTo(hr + bl * .6, -bt * .8, hr + bl, bt * .1); ctx.quadraticCurveTo(hr + bl * .55, bt, hr * .7, bt * .7); ctx.closePath();
            ctx.fillStyle = BK; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw * .7; ctx.stroke();
            ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(hr * .8, bt * .1); ctx.lineTo(hr + bl * .85, bt * .1); ctx.stroke();
            const blink = ((now * .8 + a.seed * 3) % 4.3) < .11;                                         // eye
            ctx.fillStyle = INK; ctx.strokeStyle = INK;
            if (blink) { ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hr * .12, -hr * .2); ctx.lineTo(hr * .6, -hr * .22); ctx.stroke() }
            else { ctx.beginPath(); ctx.arc(hr * .38, -hr * .2, Y ? 1.15 : .95, 0, 7); ctx.fill() }
            ctx.restore();   // head
            ctx.restore();   // body group
        }

        function dkDraw(a, gy, sx, S, now, under) {
            const sc = S * a.s * (a.lane ? .94 : 1), wet = a.mode === 'W' && !a.hop, F0 = a.fv, F = Math.abs(F0) < .15 ? .15 * (Math.sign(F0) || 1) : F0;
            const onDock = a.x >= DOCK_X0 && a.x <= DOCK_X1;
            const oy = gy + 4 + a.y + (a.lane && !a.hop && !onDock ? -2.2 * sc : 0);   // back-lane ducklings sit slightly higher = depth
            ctx.save();
            if (wet && !under) { const wl = gy + 4 + waterSurfaceY(a.x); ctx.beginPath(); ctx.rect(sx - 200, gy - 1200, 400, wl - (gy - 1200)); ctx.clip() }   // lower body is under the water
            ctx.translate(sx, oy); ctx.scale(sc * F, sc);
            dkShape(a, now, wet, under);
            ctx.restore();
        }

        function dkWaterFX(a, gy, sx, S, now) {                           // ink ripple ring + wake lines on the waterline
            const sc = S * a.s, F = Math.sign(a.fv) || 1, wl = gy + 4 + waterSurfaceY(a.x), bx = (a.young ? 10.5 : 14) * sc;
            ctx.save(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.lineCap = 'round'; ctx.globalAlpha = .42 * (1 - .4 * DN.d);
            ctx.beginPath(); ctx.ellipse(sx, wl + 1, bx * (1.35 + .1 * Math.sin(now * 2 + a.seed)) + a.dip * 6 * sc, 2.4, 0, 0, 7); ctx.stroke();
            const mv = Math.min(1, Math.abs(a.vx) / 30);
            if (mv > .15) {
                const L = (22 + 40 * mv) * sc; ctx.globalAlpha = .5 * mv * (1 - .4 * DN.d);
                for (let q = 0; q < 2; q++) { ctx.beginPath(); ctx.moveTo(sx - F * bx * .9, wl + 1 + q * 2.5); ctx.lineTo(sx - F * (bx * .9 + L * (1 - q * .3)), wl + 1 + q * 2.5 + (q ? 1.6 : -1.6)); ctx.stroke() }
            }
            ctx.restore();
        }

        function drawDuckFam(gy) {
            if (!DK.init) return;
            const S = CSc(), now = performance.now() / 1000, top = gy + 4, sxp = W / 2 + POND_X - P.x;
            const list = [DK.m].concat(DK.k).filter(a => !a.dead && Math.abs(a.x - P.x) < W / 2 + 200);
            if (!list.length) return;
            const z = a => a.mother ? 2 : (a.lane ? 0 : 1);
            list.sort((p, q) => z(p) - z(q));                             // back lane first, mother in front
            const wets = list.filter(a => a.mode === 'W' && !a.hop);
            if (wets.length) {                                            // faint submerged pass (paddling feet)
                ctx.save(); waterShape(sxp, top); ctx.clip(); ctx.globalAlpha = .38;
                for (const a of wets) dkDraw(a, gy, a.x - P.x + W / 2, S, now, true);
                ctx.restore();
            }
            for (const a of list) {
                const sx = a.x - P.x + W / 2;
                dkDraw(a, gy, sx, S, now, false);
                if (a.mode === 'W' && !a.hop) dkWaterFX(a, gy, sx, S, now);
            }
        }


        function frame(now) {


            const dt0 = Math.min(.033, (now - last) / 1000); last = now;
            let dt = dt0;
            if (hitstop > 0) { hitstop -= dt0; dt = 0 }

            update(dt); for (const e of ENEMIES) updateEnemy(e, dt); updateKnives(dt); updateGroundKnives(dt); gunTick(dt); sgTick(dt); sgGroundTick(dt); spinTick(dt); smokeTick(dt); bloodFX(dt); waterFXTick(dt); brainTick(dt); gibTick(dt); boneTick(dt); weatherTick(dt); horseTick(dt); birdTick(dt); fowlTick(dt); frogTick(dt); duckTick(dt); crocTick(dt); bgTick(dt); dayTick(dt0); fireflyTick(dt0); stExtrasTick(dt0);
            deckTick();
            shake = Math.max(0, shake - dt0 * 60);
            ctx.save();
            if (shake > .3) ctx.translate((Math.random() - .5) * shake * 1.6, (Math.random() - .5) * shake * 1.6);
            ctx.fillStyle = paper; ctx.fillRect(-60, -60, W + 120, H + 120);
            const gy = groundY();
            drawBackdrop(gy);
            drawWorld(gy);
            drawWindowGlow(gy);
            drawSkid(gy);
            drawSplats(gy);
            drawBGoreGround(gy);
            drawButts(gy);
            drawGhosts(gy);
            drawSgProp(gy, false);
            drawEnemies(gy);
            drawGutFX(gy);
            drawIntestines(gy);
            drawCords(gy);
            drawVeins(gy);
            drawBrainBits(gy);
            drawGibs(gy);
            drawLegVeins(gy);
            drawBones(gy);
            drawFootKnives(gy);
            drawKnives(gy);
            drawShots(gy);
            drawPellets(gy);
            drawWaterFX(gy);
            drawBirds(gy);
            drawFowl(gy);
            drawDuckFam(gy);
            drawFrogs(gy);
            drawCroc(gy); drawCrocGore(gy);
            drawBGoreAir(gy);
            drawHorse(gy);
            beginSwimDraw(gy);
            drawChar(W / 2, gy - P.dh, P);
            endSwimDraw();
            drawBreath(gy);
            drawStairHint(gy);
            drawLadderHint(gy);
            drawForest(gy, 1);
            drawSgProp(gy, true);
            drawSmoke(gy);
            drawBlood(gy);
            drawWeather(gy);
            ctx.restore();
            drawNight(gy);
            drawFrogGlints(gy);
            drawFireflies(gy);
            ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
            drawHUD();
            drawGunHUD();
            drawShotgunHUD();
            drawBirdsHUD();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
