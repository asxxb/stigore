<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ink Walker</title>
    <style>
        :root {
            --paper: #e4e2de;
            --ink: #111;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--paper);
            overflow: hidden;
            touch-action: none
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%
        }

        #hud {
            position: fixed;
            left: 14px;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            font: 15px/1.4 Georgia, serif;
            color: #222;
            opacity: .7;
            pointer-events: none
        }

        .btns {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 18px
        }

        .btns div {
            display: flex;
            gap: 12px
        }

        .b {
            width: 68px;
            height: 68px;
            border: 3px solid #111;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            font: 28px Georgia, serif;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none
        }

        @media (pointer:coarse) {
            .btns {
                display: flex
            }
        }

        @media (max-width:420px) {
            .b {
                width: 56px;
                height: 56px;
                font-size: 24px
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="hud">A / D or ← → to walk · Shift to run · Space to jump · K: knife · L: throw knife · E: pull knife out
    </div>
    <div class="btns">
        <div><span class="b" id="bl">◀</span><span class="b" id="br">▶</span></div>
        <div><span class="b" id="bp">J</span><span class="b" id="bk">K</span><span class="b" id="bj">▲</span></div>
    </div>
    <script>
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        let W, H, DPR, paper, vig;
        function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s) }
        function makePaper() {
            const p = document.createElement('canvas'); p.width = p.height = 512; const g = p.getContext('2d');
            g.fillStyle = '#e6e4e0'; g.fillRect(0, 0, 512, 512);
            const id = g.getImageData(0, 0, 512, 512), d = id.data;
            for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 26; d[i] += n; d[i + 1] += n; d[i + 2] += n }
            g.putImageData(id, 0, 0);
            g.globalAlpha = .05; g.strokeStyle = '#777';
            for (let i = 0; i < 260; i++) { g.beginPath(); const x = Math.random() * 512, y = Math.random() * 512; g.moveTo(x, y); g.lineTo(x + Math.random() * 10 - 5, y + Math.random() * 10 - 5); g.stroke() }
            paper = ctx.createPattern(p, 'repeat');
        }
        function resize() {
            DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
            cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .8);
            vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(60,50,40,.28)');
        }
        makePaper(); resize(); addEventListener('resize', resize);

        const keys = {};
        addEventListener('keydown', e => {
            keys[e.code] = 1;
            if (e.code === 'Space') e.preventDefault();
            if (e.repeat) return;
            if (e.code === 'KeyC') pressSmoke();
            if (P.sm === 1) return;                 // no actions while lighting up
            if (e.code === 'KeyG') pressG();
            if (e.code === 'KeyF') pressFire();
            if (e.code === 'KeyR') pressReload();
            if (e.code === 'KeyK') pressK();
            if (e.code === 'KeyL') pressThrow();
            if (e.code === 'KeyE') pressFinish();
            if (e.code === 'Space') pressJump();
            if (e.code === 'KeyJ') pressAtk();
        });
        addEventListener('keyup', e => keys[e.code] = 0);
        function hold(id, k) {
            const el = document.getElementById(id);
            ['pointerdown'].forEach(t => el.addEventListener(t, e => { e.preventDefault(); keys[k] = 1 }));
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, () => keys[k] = 0));
        }
        hold('bl', 'ArrowLeft'); hold('br', 'ArrowRight'); hold('bj', 'Space'); document.getElementById('bk').addEventListener('pointerdown', e => { e.preventDefault(); pressK() });
        document.getElementById('bj').addEventListener('pointerdown', pressJump);


        const P = {
            gk: 0, x: 0, vx: 0, z: 0, vz: 0, face: 1, phase: 0, dist: 0, atk: 0, kn: 0, kt: 0, amp: 0, lean: 0, tt: 0, rv: 0,
            jbuf: 0, coy: 0, cs: 0, ct: 0, chit: false, abuf: 0, clast: 0, cgr: 0, gt: 0, grabbed: null,
            skid: 0, skidDir: 1, skidK: 0, skA: 0, sk: null,
            idle: 0, idleAt: 3.5, fid: 0, fidType: 0, fidT: 0, fidDur: 2.4, fidK: 0
        };
        // knife states: kn 0 = away, 1 = forward grip, 2 = reverse grip (blade to the back)
        let CUR = P; const PL = P;   // CUR = character being drawn/animated (player or NPC)
        P.thw = 0; P.thr = 0;           // throw timer / released flag
        P.fin = 0; P.finE = null; P.finDone = 0;
        const THR_T = .32;              // throw animation length
        const knives = [];
        const THROW_RANGE = 650;   // max distance (px) a thrown knife can fly before it drops
        const PICKUP_R = 70;       // how close you need to be to grab a knife (scaled)
        let hasKnife = true;       // you only own one knife now
        const groundKnives = [];
        const TOSS_T = .95;
        function pressK() {
            if (P.thw > 0 || P.fin > 0) return;
            if (P.gun) { banner.t = .6; banner.text = 'HOLSTER GUN FIRST (G)'; return }
            P.idle = 0; P.fid = 0;
            if (P.tt > 0) return;
            if (P.kn === 0) {
                if (!hasKnife) { banner.t = .6; banner.text = 'NO KNIFE!'; return }
                P.kn = 1; P.rv = 0
            }
            else if (P.kn === 1) { if (P.kt > .95) P.tt = .0001 }
            else P.kn = 0;
        }

        let last = performance.now();
        function groundY() { return H * 0.76 }

        // ---- movement feel tuning ----
        const GRAV = 1700;
        const JUMP_V = 540;
        const CUT_MULT = 6;
        const COYOTE = .1;
        const BUFFER = .1;
        const SKID_MIN = 280;
        const SKID_END = 60;
        const SKID_ACC = 1300;
        const IDLE_MIN = 3, IDLE_MAX = 6;
        function pressJump() { P.jbuf = BUFFER }

        // ---- ink skid marks + flecks + ghost afterimages (world space) ----
        const streaks = [], flecks = [], ghosts = [], impacts = [];
        function startSkid(d) {
            P.skid = 1; P.skidDir = d; P.face = d; P.skA = 0;
            const S = CSc(), mk = (off, dy, w) => { const x = P.x + d * off * S, st = { x0: x, x1: x, off, dy, w, live: true, t: 0, seed: Math.random() * 100 }; streaks.push(st); return st };
            P.sk = [mk(62, 5.5, 8), mk(14, 9.5, 5.5)];
        }
        function endSkid() { P.skid = 0; if (P.sk) for (const s of P.sk) s.live = false; P.sk = null }
        function skidFX(dt) {
            const S = CSc();
            if (P.skid) {
                for (const s of P.sk) s.x1 = P.x + P.skidDir * s.off * S;
                P.skA += dt;
                while (P.skA > .03) {
                    P.skA -= .03;
                    flecks.push({ x: P.x + P.skidDir * 62 * S, y: -2, vx: P.skidDir * (40 + Math.random() * 120), vy: -(60 + Math.random() * 180), r: 1 + Math.random() * 2, t: 0, life: .35 + Math.random() * .3 })
                }
            }
            for (let i = flecks.length - 1; i >= 0; i--) { const f = flecks[i]; f.t += dt; f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.t > f.life || f.y > 0) flecks.splice(i, 1) }
            for (let i = impacts.length - 1; i >= 0; i--) { impacts[i].t += dt; if (impacts[i].t >= impacts[i].life) impacts.splice(i, 1) }
            for (let i = streaks.length - 1; i >= 0; i--) { const s = streaks[i]; if (!s.live) { s.t += dt; if (s.t > 3.4) streaks.splice(i, 1) } }
            for (let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.t += dt; if (g.t >= g.life) ghosts.splice(i, 1) }
        }
        function addGhost(P, pose) {
            if (ghosts.length > 14) ghosts.shift();
            ghosts.push({
                x: P.x, z: P.z, face: P.face,
                pose: {
                    a0: pose.a0, f0: pose.f0, a1: pose.a1, f1: pose.f1,
                    lean: pose.lean, hipX: pose.hipX, hipY: pose.hipY,
                    arch: pose.arch, hx: pose.hx, hy: pose.hy,
                    l0: [...pose.l0], l1: [...pose.l1]
                },
                t: 0, life: 0.22, alpha: 0.44
            });
        }
        function drawGhosts(gy) {
            const S = CSc();
            for (const g of ghosts) {
                const sx = g.x - P.x + W / 2;
                if (Math.abs(sx - W / 2) > W / 2 + 150) continue;
                const a = Math.max(0, (1 - g.t / g.life) * g.alpha);
                if (a <= 0.01) continue;
                const F = g.face, pose = g.pose;
                ctx.save(); ctx.translate(sx, gy + 4); ctx.scale(S, S); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.globalAlpha = a * 0.75; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
                const z = g.z / S, hipX = pose.hipX || 0, hipY = -(ANK + 120) + z + (pose.hipY || 0), l = F * pose.lean;
                const rot = (x, y) => [hipX + x * Math.cos(l) - y * Math.sin(l), hipY + x * Math.sin(l) + y * Math.cos(l)];
                const nk = rot(0, -T), cp = rot(-F * (9 + (pose.arch || 0) * 28), -T / 2);
                for (let i = 1; i >= 0; i--) {
                    const targetL = i === 0 ? pose.l0 : pose.l1, fx = hipX + F * targetL[0], fy = targetL[1] - (targetL[2] || 0);
                    const ax = fx, ay = fy - ANK, dx = ax - hipX, dy = ay - hipY, dd = Math.hypot(dx, dy);
                    const d = Math.min(dd, 2 * L1 - 0.5), ux0 = dx / (dd || 1), uy0 = dy / (dd || 1), mx = hipX + ux0 * d / 2, my = hipY + uy0 * d / 2;
                    const h = Math.sqrt(Math.max(0, L1 * L1 - d * d / 4));
                    let nx = -uy0, ny = ux0; if (nx * F < 0) { nx = -nx; ny = -ny }
                    const kx = mx + nx * h, ky = my + ny * h;
                    ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.lineTo(ax, ay); ctx.stroke();
                    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 7); ctx.fill();
                }
                ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.quadraticCurveTo(cp[0], cp[1], nk[0], nk[1]); ctx.stroke();
                if (P === PL) { const hp = rot(F * 8, -14); P.hol = [hp[0], hp[1], l]; drawHolster(P.hol, F, P.gunK < .3 && P.gs !== 2) }
                const sh = rot(0, -T + 10);
                for (let i = 0; i < 2; i++) {
                    const ang = i ? pose.a1 : pose.a0, flex = i ? pose.f1 : pose.f0, d1 = [Math.sin(ang) * F, Math.cos(ang)], el = [sh[0] + d1[0] * 58, sh[1] + d1[1] * 58];
                    const d2 = [Math.sin(ang + flex) * F, Math.cos(ang + flex)], wr = [el[0] + d2[0] * 56, el[1] + d2[1] * 56];
                    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(el[0], el[1]); ctx.lineTo(wr[0], wr[1]); ctx.stroke();
                    ctx.beginPath(); ctx.arc(wr[0], wr[1], 4.5, 0, 7); ctx.fill();
                }
                const hd = rot(-F * 7 + F * (pose.hx || 0), -T - 24 + (pose.hy || 0));
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hd[0], hd[1], 23, 0, 7); ctx.stroke();
                ctx.restore();
            }
        }
        function drawSkid(gy) {
            ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
            for (const s of streaks) {
                const a = s.live ? 1 : 1 - sm(Math.max(0, s.t - 1.2) / 2.2);
                const sx0 = s.x0 - P.x + W / 2, sx1 = s.x1 - P.x + W / 2, len = Math.abs(sx1 - sx0);
                if (len < 3 || a <= 0) continue;
                const dr = Math.sign(sx1 - sx0), y = gy + s.dy;
                for (let d = 0; d < len; d += 10) {
                    const i = d / 10, e = Math.min(len, d + 10);
                    ctx.globalAlpha = a * (.55 + .45 * hash(s.seed + i));
                    ctx.lineWidth = s.w * (.3 + .7 * Math.min(1, d / 60)) * (.8 + .4 * hash(s.seed + i * 3));
                    ctx.beginPath(); ctx.moveTo(sx0 + dr * d, y + (hash(s.seed + i * 7) - .5) * 1.6); ctx.lineTo(sx0 + dr * e, y + (hash(s.seed + i * 7 + 1) - .5) * 1.6); ctx.stroke();
                }
            }
            for (const m of impacts) {
                const k = m.t / m.life, sx = m.x - P.x + W / 2, sy = gy + 4 + m.y; ctx.globalAlpha = 1 - k * k;
                for (let i = 0; i < 12; i++) {
                    const ang = i / 12 * Math.PI * 2 + hash(i + m.seed) * .3, r0 = m.s * .15 * (1 + k), r1 = m.s * (.35 + .5 * hash(i * 2.3 + m.seed)) * (.4 + .9 * Math.min(1, k * 2));
                    ctx.lineWidth = Math.max(1, 6 * (1 - k) * (.5 + hash(i))); ctx.beginPath(); ctx.moveTo(sx + Math.cos(ang) * r0, sy + Math.sin(ang) * r0); ctx.lineTo(sx + Math.cos(ang) * r1, sy + Math.sin(ang) * r1); ctx.stroke()
                }
            }
            for (const f of flecks) { ctx.globalAlpha = Math.max(0, 1 - f.t / f.life); ctx.beginPath(); ctx.arc(f.x - P.x + W / 2, gy + 4 + f.y, f.r, 0, 7); ctx.fill() }
            ctx.restore();
        }

        // ---- idle fidgets ----
        function startFidget(q) {
            q.fid = 1; q.fidT = 0;
            const canStretch = q.kn === 0 && q.kt < .05;
            q.fidType = (canStretch && Math.random() < .5) ? 2 : 1;
            q.fidDur = q.fidType === 2 ? 2.4 : 2.8;
            q.idleAt = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
        }
        function fidgetTick(q, busy, dt) {
            if (busy) { q.idle = 0; q.fid = 0 }
            else if (q.fid) { q.fidT += dt; if (q.fidT >= q.fidDur) { q.fid = 0; q.idle = 0 } }
            else { q.idle += dt; if (q.idle >= q.idleAt) startFidget(q) }
            q.fidK += ((q.fid ? 1 : 0) - q.fidK) * Math.min(1, dt * (q.fid ? 8 : 12));
            if (!q.fid && q.fidK < .01) { q.fidK = 0; q.fidT = 0 }
        }
        function lookCurve(u) {
            const k = [[0, 0], [.18, -1], [.42, -1], [.6, .9], [.8, .9], [1, 0]];
            for (let i = 1; i < k.length; i++)if (u <= k[i][0]) { const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * sm((u - a[0]) / (b[0] - a[0])) }
            return 0;
        }
        function stretchEnv(u) { return u < .25 ? sm(u / .25) : u < .75 ? 1 : 1 - sm((u - .75) / .25) }

        function update(dt) {
            const dir = (P.fin > 0 || P.sm === 1) ? 0 : (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
            const run = keys.ShiftLeft || keys.ShiftRight;
            const max = run ? 520 : 190;
            const grounded = P.z >= 0;
            const acc = grounded ? 900 : 300;

            // ---- skid turn: reversing at a run ----
            const vs = Math.sign(P.vx);
            if (P.skid) { if (!grounded || !dir || dir === vs || Math.abs(P.vx) < SKID_END) endSkid() }
            else if (grounded && dir && vs && dir !== vs && Math.abs(P.vx) >= SKID_MIN && !P.cs) startSkid(vs);

            if (dir && !P.cs) {
                if (P.skid) P.vx += dir * SKID_ACC * dt;
                else { P.vx += dir * acc * dt; if (P.skidK < .25) P.face = dir }
            }
            else if (grounded) { const f = 1400 * dt; P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f }
            const lim = max; if (Math.abs(P.vx) > lim) P.vx += (Math.sign(P.vx) * lim - P.vx) * Math.min(1, dt * 8);
            P.x += P.vx * dt;

            // ---- jump: buffering + coyote time + variable height ----
            if (grounded) P.coy = COYOTE; else P.coy = Math.max(0, P.coy - dt);
            if (P.jbuf > 0) {
                if ((grounded || P.coy > 0) && !P.cs && !P.fin) { P.vz = -JUMP_V; P.jbuf = 0; P.coy = 0; P.grabbed = null; P.clast = 0 }  // jumping breaks the clinch
                else P.jbuf = Math.max(0, P.jbuf - dt);
            }
            const g = GRAV * (P.vz < 0 && !keys.Space ? CUT_MULT : 1);
            if (P.vz !== 0 || P.z < 0) { P.vz += g * dt; P.z += P.vz * dt; if (P.z >= 0) { P.z = 0; P.vz = 0 } }

            const sp = Math.abs(P.vx);

            if (P.z >= 0) P.phase += sp * dt / (((1 - Rf()) * 280 + Rf() * RUN_LC) * CSc()) * Math.PI * 2;
            if (P.atk > 0) P.atk -= dt;
            P.kt = Math.max(0, Math.min(1, P.kt + (P.kn ? 1 : -1) * dt * 3.5));
            if (P.tt > 0) { P.tt += dt; if (P.tt >= TOSS_T) { P.tt = 0; P.kn = 2; P.rv = 1 } }
            if (P.thw > 0) {
                P.thw += dt;
                if (!P.thr && P.thw >= THR_T * .65) releaseKnife();
                if (P.thw >= THR_T) { P.thw = 0; P.thr = 0 }
            }
            if (P.fin > 0) finTick(dt);
            comboTick(dt);
            const target = Math.min(1, sp / 200) * (run && sp > 220 ? 1.25 : 1);
            P.amp += (target - P.amp) * Math.min(1, dt * 10);
            const tl = Math.max(-1, Math.min(1, P.vx / 420)) * 0.4;
            P.lean += (tl - P.lean) * Math.min(1, dt * 6);

            // ---- skid pose blend + marks ----
            P.skidK += ((P.skid ? 1 : 0) - P.skidK) * Math.min(1, dt * 14);
            if (!P.skid && P.skidK < .005) P.skidK = 0;
            skidFX(dt);

            // ---- clinch blend (0..1): drives step-in, lean and hand IK ----

            if (grounded && Math.abs(P.vx) > 300) {
                P.dust = (P.dust || 0) - dt;
                if (P.dust <= 0) {
                    P.dust = .06; const d = -Math.sign(P.vx);
                    flecks.push({ x: P.x + d * 30 * CSc(), y: -2, vx: d * (60 + Math.random() * 80), vy: -(40 + Math.random() * 90), r: 1 + Math.random() * 1.8, t: 0, life: .3 + Math.random() * .25 });
                }
            }
            // ---- idle fidgets ----
            fidgetTick(P, dir || keys.Space || keys.KeyJ || keys.KeyF || P.sm > 0 || P.cs > 0 || P.skid || !grounded || sp > 8 || P.tt > 0 || P.atk > 0 || P.thw > 0, dt);
        }

        // ================= COMBAT =================
        function lerp(a, b, u) { return a + (b - a) * u }
        function lerpKF(k1, k2, u) {
            return {
                a0: lerp(k1.a0, k2.a0, u),
                f0: lerp(k1.f0, k2.f0, u),
                a1: lerp(k1.a1, k2.a1, u),
                f1: lerp(k1.f1, k2.f1, u),
                lean: lerp(k1.lean, k2.lean, u),
                hipX: lerp(k1.hipX || 0, k2.hipX || 0, u),
                hipY: lerp(k1.hipY || 0, k2.hipY || 0, u),
                arch: lerp(k1.arch || 0, k2.arch || 0, u),
                hx: lerp(k1.hx || 0, k2.hx || 0, u),
                hy: lerp(k1.hy || 0, k2.hy || 0, u),
                l0: [lerp(k1.l0[0], k2.l0[0], u), lerp(k1.l0[1], k2.l0[1], u), lerp(k1.l0[2] || 0, k2.l0[2] || 0, u)],
                l1: [lerp(k1.l1[0], k2.l1[0], u), lerp(k1.l1[1], k2.l1[1], u), lerp(k1.l1[2] || 0, k2.l1[2] || 0, u)]
            };
        }

        const STEPS = [
            // 1. HEAD GRAB / CLINCH
            {
                name: 'grab', dur: 0.32, wind: 0.04, hit: 0.08, hold: 0.12, link: 0.11,
                reach: 165, dmg: 6, kb: 0, up: 0, lv: 340, pause: 0.05, shake: 3.5, fx: 14,
                sw: [110, -0.2, 0.3, 3, 25, -15],

            // the gun pivots on its trigger guard, just ahead of the fist

            const lx = 16 - 5 * r - 8 * Math.cos(sp) - Math.sin(sp), ly = -4 - 8 * Math.sin(sp) + Math.cos(sp);
            let ox = wr[0] + F * (lx * ca - ly * sa), oy = wr[1] + lx * sa + ly * ca, th = wrapA(a + sp);
            const wf = RC_WRIST * r * r;
            if (wf > .001) {                       // pivot the gun about the wrist so the muzzle flips up
                const dxw = ox - wr[0], dyw = oy - wr[1], d = -F * wf, cd = Math.cos(d), sd = Math.sin(d);
                ox = wr[0] + dxw * cd - dyw * sd; oy = wr[1] + dxw * sd + dyw * cd; th -= wf;
            }
            const pvx = wr[0] + F * (16 * ca + 4 * sa), pvy = wr[1] + 16 * sa - 4 * ca;

            // slide between the hand and the holster (quick-draw / spin-to-holster)
            const dk = P.gs === 2 ? sm((P.gsT - .6) / .3) : P.gdT < .25 ? 1 - sm(P.gdT / .25) : 0, hol = P.hol;
            if (dk > 0 && hol) {
                const c = Math.cos(1.9), s = Math.sin(1.9);
                ox += (hol[0] - F * (22 * c + 8 * s) - ox) * dk; oy += (hol[1] - (22 * s - 8 * c) - oy) * dk; th += (1.9 + F * hol[2] - th) * dk;
            }

            if ((P.gs === 1 && !P.gsEnd) || (P.gs === 2 && P.gsT < .55)) {      // ink arcs trailing the barrel
                ctx.save(); ctx.translate(pvx, pvy); ctx.scale(F, 1); ctx.strokeStyle = '#111'; ctx.lineCap = 'round';
                const t0 = a + sp;
                for (let j = 0; j < 3; j++) { ctx.globalAlpha = (.3 - j * .08) * Math.min(1, P.gsK + .3); ctx.lineWidth = 2.4 - j * .6; ctx.beginPath(); ctx.arc(0, 0, 38 - j * 5, t0 - 1.9 + j * .15, t0 - .12, false); ctx.stroke() }
                ctx.restore();
            }

            ctx.save(); ctx.translate(ox, oy); ctx.scale(F, 1); ctx.rotate(th);
            ctx.globalAlpha = Math.min(1, P.gunK * 1.6); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.2;
            ctx.fillStyle = '#9a4a1a'; ctx.beginPath(); ctx.moveTo(-2, -4); ctx.lineTo(9, -4); ctx.lineTo(5, 16); ctx.lineTo(-7, 15); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#d9a23a'; ctx.beginPath(); ctx.arc(1.5, 8, 1.6, 0, 7); ctx.fill();
            ctx.fillStyle = '#585c64'; ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(-9, -19); ctx.lineTo(-1, -15); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#6f737a'; ctx.beginPath(); ctx.rect(-4, -13, 26, 10); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#7c8088'; ctx.beginPath(); ctx.rect(22, -13, 23, 6); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.rect(40, -16, 4, 3); ctx.fill();
            ctx.fillStyle = '#585c64'; ctx.beginPath(); ctx.rect(7, -16, 13, 13); ctx.fill(); ctx.stroke();
            ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(17, -12); ctx.moveTo(10, -7); ctx.lineTo(17, -7); ctx.stroke();
            ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(8, -1, 5, .1, Math.PI - .1); ctx.stroke();
            ctx.strokeStyle = '#d8d6d0'; ctx.globalAlpha *= .6; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(24, -12); ctx.lineTo(43, -12); ctx.stroke();
            ctx.globalAlpha = Math.min(1, P.gunK * 1.6);
            if (r > .5) {
                const f = Math.min(1, (r - .5) / .5), n = Math.floor(now * 30);
                ctx.save(); ctx.translate(47, -10); ctx.globalAlpha = f; ctx.fillStyle = '#ffb02e'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.6; ctx.beginPath();
                for (let i = 0; i < 12; i++) { const rr = i % 2 ? 6 : 20 + 8 * hash(i + n), t = i / 12 * Math.PI * 2; const x = Math.cos(t) * rr * 1.4, y = Math.sin(t) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y) }
                ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill(); ctx.restore();
            }
            ctx.restore();
            if (dk > .35 && hol) drawHolster(hol, F, false);     // pouch goes back on top, so the barrel looks inserted
        }
        function drawShots(gy) {
            ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
            for (const b of bullets) {
                const sx = b.x - P.x + W / 2, sy = gy + 4 + b.y, ux = b.F * Math.cos(b.th), uy = Math.sin(b.th);
                ctx.globalAlpha = .9; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - ux * 26, sy - uy * 26); ctx.stroke();
                ctx.globalAlpha = .35; ctx.lineWidth = 1.6;
                for (let j = -1; j <= 1; j += 2) { ctx.beginPath(); ctx.moveTo(sx - ux * 30 - uy * j * 4, sy - uy * 30 + ux * j * 4); ctx.lineTo(sx - ux * 110 - uy * j * 4, sy - uy * 110 + ux * j * 4); ctx.stroke() }
            }
            ctx.lineWidth = 1.4; ctx.fillStyle = '#c99a3a';
            for (const s of shells) {
                const sx = s.x - P.x + W / 2; if (sx < -20 || sx > W + 20) continue;
                ctx.globalAlpha = s.landed ? Math.min(1, (8 - s.t) / 2) : 1;
                ctx.save(); ctx.translate(sx, gy + 4 + s.y - (s.landed ? 1.5 : 0)); ctx.rotate(s.rot); ctx.beginPath(); ctx.rect(-3.5, -1.8, 7, 3.6); ctx.fill(); ctx.stroke(); ctx.restore();
            }
            ctx.restore();
        }
        function drawGunHUD() {
            if (P.gunK < .05) return;
            ctx.save(); ctx.globalAlpha = Math.min(1, P.gunK); ctx.lineWidth = 2.5; ctx.strokeStyle = '#111';
            for (let i = 0; i < MAG; i++) { ctx.beginPath(); ctx.arc(30 + i * 22, calcTop() + 24, 8, 0, 7); ctx.fillStyle = i < P.ammo ? '#c99a3a' : 'rgba(0,0,0,0)'; ctx.fill(); ctx.stroke() }
            if (P.rl > 0) { ctx.fillStyle = '#111'; ctx.font = 'italic 18px Georgia,serif'; ctx.fillText('reloading…', 22, calcTop() + 56) }
            ctx.restore();
        }

        // ================= FINGER SPIN / HOLSTER =================
        const TAU = Math.PI * 2;
        P.gs = 0;        // 0 none, 1 idle spin, 2 spin-to-holster
        P.gsT = 0; P.gsA = 0; P.gsK = 0; P.gsIdle = 0; P.gsAt = 3; P.gsEnd = 0; P.gsFast = 0; P.gsDur = 2;
        P.gsFrom = 0; P.gsTo = 0; P.gdT = 1; P.q = 0; P.qT = 0; P.hol = null;

        function gStill() { return P.z >= 0 && Math.abs(P.vx) < 8 && !(P.cs > 0 || P.fin > 0 || P.thw > 0 || P.tt > 0 || P.kt > .05 || P.skid || P.abuf > 0 || P.sm > 0) }
        function startSpin() { P.gs = 1; P.gsT = 0; P.gsA = 0; P.gsEnd = 0; P.gsFast = 0; P.gsDur = 2 + Math.random() * 1.5 }

        function spinTick(dt) {
            P.gdT = Math.min(1, P.gdT + dt);
            if (P.q) { P.qT -= dt; if (P.qT <= 0) P.q = 0 }
            if (!P.gun) { P.gs = 0; P.gsA = 0; P.gsIdle = 0; P.q = 0; P.gsK += (0 - P.gsK) * Math.min(1, dt * 14); return }

            if (P.gs === 2) {                                   // spin-to-holster
                P.gsT += dt;
                const u = Math.min(1, P.gsT / .6);
                P.gsA = P.gsFrom + (P.gsTo - P.gsFrom) * (1 - (1 - u) * (1 - u));
                P.gsK += (1 - P.gsK) * Math.min(1, dt * 12);
                if (P.gsT >= .95) { P.gs = 0; P.gsA = 0; P.gsK = 0; P.gun = 0; P.gunK = 0; P.rl = 0 }
                return;
            }

            const calm = P.gunK > .9 && gStill() && P.rl <= 0 && P.fireCd <= 0 && P.recoil < .1 && !(keys.KeyW || keys.KeyS || keys.ArrowUp || keys.ArrowDown);
            if (P.gs === 0) {
                P.gsK += (0 - P.gsK) * Math.min(1, dt * 12);
                if (!calm) { P.gsIdle = 0; return }
                P.gsIdle += dt;
                if (P.gsIdle >= P.gsAt) startSpin();
                return;
            }
            // idle spin
            P.gsK += (1 - P.gsK) * Math.min(1, dt * 9);
            P.gsT += dt;
            if (!calm) { P.gsEnd = 1; P.gsFast = 1 }
            if (P.gsT > P.gsDur) P.gsEnd = 1;
            if (!P.gsEnd) {
                P.gsA += 13 * sm(P.gsT / .4) * dt;               // winds up to about 2 turns a second
            } else {                                            // finish the current turn so the barrel ends pointing forward
                const tgt = Math.ceil(P.gsA / TAU - 1e-6) * TAU, rem = tgt - P.gsA;
                const w = P.gsFast ? 28 : Math.max(2.6, Math.min(12, rem * 9));
                P.gsA = Math.min(tgt, P.gsA + w * dt);
                if (P.gsA >= tgt - 1e-4) {
                    P.gs = 0; P.gsA = 0; P.gsIdle = 0; P.gsAt = 2.5 + Math.random() * 2.5;
                    if (P.q) { const q = P.q; P.q = 0; if (q === 1) pressFire(); else pressReload() }
                }
            }
        }

        function drawHolster(h, F, grip) {      // h = [x, y, bodyLean] at the holster mouth
            ctx.save(); ctx.translate(h[0], h[1]); ctx.rotate(h[2]); ctx.scale(F, 1); ctx.rotate(.33);
            ctx.lineJoin = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = '#111';
            if (grip) {
                ctx.fillStyle = '#6f737a'; ctx.beginPath(); ctx.rect(-5, -12, 11, 13); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#9a4a1a'; ctx.beginPath(); ctx.moveTo(-5, -12); ctx.lineTo(-16, -9); ctx.lineTo(-14, 0); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            ctx.fillStyle = '#4a3322'; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(6, 22); ctx.quadraticCurveTo(0, 27, -6, 22); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#c99a3a'; ctx.beginPath(); ctx.arc(0, 5, 1.6, 0, 7); ctx.fill();
            ctx.restore();
        }


        function frame(now) {


            const dt0 = Math.min(.033, (now - last) / 1000); last = now;
            let dt = dt0;
            if (hitstop > 0) { hitstop -= dt0; dt = 0 }

            update(dt); for (const e of ENEMIES) updateEnemy(e, dt); updateKnives(dt); updateGroundKnives(dt); gunTick(dt); spinTick(dt); smokeTick(dt); bloodFX(dt);
            shake = Math.max(0, shake - dt0 * 60);
            ctx.save();
            if (shake > .3) ctx.translate((Math.random() - .5) * shake * 1.6, (Math.random() - .5) * shake * 1.6);
            ctx.fillStyle = paper; ctx.fillRect(-60, -60, W + 120, H + 120);
            const gy = groundY();
            drawWorld(gy);
            drawSkid(gy);
            drawSplats(gy);
            drawButts(gy);
            drawGhosts(gy);
            drawEnemies(gy);
            drawKnives(gy);
            drawShots(gy);
            drawChar(W / 2, gy, P);
            drawSmoke(gy);
            drawBlood(gy);
            ctx.restore();
            ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
            drawHUD();
            drawGunHUD();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
